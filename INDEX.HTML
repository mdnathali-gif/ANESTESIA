  'MÚLTIPLES INTENTOS (>3) \u2014 SE LOGRA ACCESO SIN COMPLICACIONES',
  'NEUMOTÓRAX \u2014 RX TÓRAX DE CONTROL SOLICITADA',
  'ARRITMIAS TRANSITORIAS \u2014 RESUELTAS ESPONTÁNEAMENTE AL RETIRAR GUÍA',
  'MALPOSICIÓN DEL CATÉTER \u2014 AJUSTE BAJO GUÍA ECOGRÁFICA',
  'EMBOLISMO AÉREO \u2014 DECÚBITO LATERAL IZQUIERDO Y O₂ AL 100%',
];

var COMPLICACIONES_ART = [
  'NINGUNA \u2014 PROCEDIMIENTO SIN COMPLICACIONES',
  'ESPASMO ARTERIAL \u2014 RESUELTO ESPONTÁNEAMENTE / CON CALOR LOCAL',
  'HEMATOMA LOCAL \u2014 COMPRESIÓN MANUAL, EN OBSERVACIÓN',
  'MÚLTIPLES INTENTOS (>3) \u2014 SE LOGRA ACCESO SIN COMPLICACIONES',
  'PUNCIÓN DE VENA ADYACENTE \u2014 SE RETIRA Y SE REINTENTA ARTERIA',
  'ISQUEMIA DISTAL TRANSITORIA \u2014 SE RETIRA CATÉTER, CIRCULACIÓN RESTITUIDA',
];

function getVascularState(cid) {
  var key = 'vasc_' + cid;
  if (!S.formVals[key]) {
    var isCVC = cid.indexOf('vascular-0') >= 0 || cid.indexOf('vascular-1') >= 0;
    S.formVals[key] = {
      lado: 'DERECHO',
      lumenes: '3',
      cm_insercion: '15',
      verificacion: 'RADIOGRAFÍA DE TÓRAX',
      meds: [],
      test_allen: 'POSITIVO (ADECUADO)',
      complicaciones: ['NINGUNA \u2014 PROCEDIMIENTO SIN COMPLICACIONES'],
    };
  }
  return S.formVals[key];
}

function vasc_toggle(cid, opt) {
  var v = getVascularState(cid);
  var arr = v.complicaciones || [];
  var NINGUNA = 'NINGUNA \u2014 PROCEDIMIENTO SIN COMPLICACIONES';
  if (opt === NINGUNA) {
    v.complicaciones = arr.indexOf(NINGUNA) >= 0 ? [] : [NINGUNA];
  } else {
    v.complicaciones = arr.filter(function(x){ return x !== NINGUNA; });
    if (arr.indexOf(opt) >= 0) {
      v.complicaciones = v.complicaciones.filter(function(x){ return x !== opt; });
    } else {
      v.complicaciones.push(opt);
    }
  }
  // Refresh checkboxes
  var pan = document.getElementById('vasc-compl-'+cid);
  if (pan) {
    pan.querySelectorAll('[data-opt]').forEach(function(el){
      var isChk = v.complicaciones.indexOf(el.dataset.opt) >= 0;
      var c = el.dataset.col || '';
      if (isChk) {
        el.style.cssText = 'color:'+c+';border-color:'+c+'70;background:'+c+'12;font-weight:700';
        el.querySelector('.chk-ico').textContent = '\u2611';
      } else {
        el.removeAttribute('style');
        el.querySelector('.chk-ico').textContent = '\u2610';
      }
    });
  }
}

function vasc_set(cid, key, val) {
  getVascularState(cid)[key] = val;
}

function renderVascularForm(cid, col, C) {
  function lbl(t){ return '<label class="fg-lbl">'+t+'</label>'; }
  function sec(t){ return '<div style="font-size:9.5px;font-weight:800;letter-spacing:.1em;color:'+C.t3+';margin:14px 0 8px;text-transform:uppercase">'+t+'</div>'; }
  var v = getVascularState(cid);
  var titulo = getBlockTitle(cid) || 'Acceso Vascular';
  var isArt = titulo.toLowerCase().indexOf('arterial') >= 0;
  var isSub = titulo.toLowerCase().indexOf('subclavio') >= 0;
  var fc = 'onfocus="this.style.borderColor=\''+col+'\'" onblur="this.style.borderColor=\'\'"';
  var COMPLS = isArt ? COMPLICACIONES_ART : COMPLICACIONES_CVC;

  function lbl(t){ return '<label class="fg-lbl">'+t+'</label>'; }
  function si(key, opts, val){
    var h = '<select class="f-select" '+fc+' onchange="vasc_set(\''+cid+'\',\''+key+'\',this.value)">';
    opts.forEach(function(o){ h += '<option'+(val===o?' selected':'')+'>'+esc(o)+'</option>'; });
    return h + '</select>';
  }
  function ni(key, val, ph, unit){
    return '<div class="f-input-wrap"><input type="text" class="f-input" '+fc+' value="'+esc(String(val||''))+'" placeholder="'+(ph||'___')+'"'+
      ' oninput="vasc_set(\''+cid+'\',\''+key+'\',this.value)">'+
      (unit?'<span class="f-unit">'+unit+'</span>':'')+'</div>';
  }
  function sec(t){
    return '<div style="font-size:9.5px;font-weight:800;letter-spacing:.1em;color:'+C.t3+';margin:14px 0 8px;text-transform:uppercase">'+t+'</div>';
  }

  var h = '<div class="form-gen">';
  h += '<div style="font-size:9.5px;font-weight:800;letter-spacing:.1em;color:'+C.t3+';margin-bottom:12px;text-transform:uppercase">';
  h += '\uD83E\uDE78 '+esc(titulo)+'</div>';

  /* Datos generales */
  h += '<div class="form-grid">';
  h += '<div>'+lbl('Lateralidad')+si('lado',['DERECHO','IZQUIERDO'],v.lado)+'</div>';
  if (!isArt) {
    h += '<div>'+lbl('N\u00ba de l\u00famenes')+si('lumenes',['1','2','3','4'],v.lumenes)+'</div>';
    h += '<div>'+lbl('Inserci\u00f3n a (cm)')+ni('cm_insercion',v.cm_insercion,'15','cm')+'</div>';
    h += '<div>'+lbl('Verificaci\u00f3n de posici\u00f3n')+
         si('verificacion',['RADIOGRAFÍA DE TÓRAX','ECOGRAFÍA INTRAVASCULAR','ECG INTRACAVITARIO','FLUOROSCOPIA'],v.verificacion)+
         '</div>';
  } else {
    h += '<div>'+lbl('Test de Allen')+
         si('test_allen',['POSITIVO (ADECUADO)','NO REALIZADO (EMERGENCIA)'],v.test_allen)+
         '</div>';
  }
  h += '</div>';

  /* Bloque de complicaciones */
  h += sec('\u26A0 Complicaciones');
  h += '<div id="vasc-compl-'+cid+'" class="check-g">';
  COMPLS.forEach(function(opt){
    var isChk = (v.complicaciones||[]).indexOf(opt) >= 0;
    var warnColor = opt.indexOf('NINGUNA') >= 0 ? '#059669' : '#EF4444';
    h += '<div class="chk'+(isChk?'" style="color:'+warnColor+';border-color:'+warnColor+'70;background:'+warnColor+'12;font-weight:700':'\"')+
         '" data-opt="'+esc(opt)+'" data-col="'+warnColor+'"'+
         ' onclick="vasc_toggle(\''+cid+'\',this.dataset.opt)">'+
         '<span class="chk-ico">'+(isChk?'\u2611':'\u2610')+'</span> '+esc(opt)+'</div>';
  });
  h += '</div>';

  h += '<button class="gen-btn" style="margin-top:14px;background:linear-gradient(135deg,'+col+','+col+'CC);box-shadow:0 3px 12px '+col+'40"';
  h += ' onclick="generateVascularNote(\''+cid+'\')">&#9889; GENERAR NOTA</button>';
  h += '<div id="nw-'+cid+'">';
  if (S.notes[cid]) h += renderNoteWrap(S.notes[cid], cid, col);
  h += '</div></div>';
  return h;
}

function generateVascularNote(cid) {
  var v = getVascularState(cid);
  var titulo = getBlockTitle(cid) || 'ACCESO VASCULAR';
  var isArt = titulo.toLowerCase().indexOf('arterial') >= 0;
  var isSub = titulo.toLowerCase().indexOf('subclavio') >= 0;
  var isYug = titulo.toLowerCase().indexOf('yugular') >= 0;

  var compls = (v.complicaciones||[]);
  var sinCompl = compls.some(function(c){ return c.indexOf('NINGUNA') >= 0; });
  var complStr = sinCompl
    ? 'PROCEDIMIENTO SIN COMPLICACIONES.'
    : compls.length > 0
      ? 'COMPLICACIONES:\n'+compls.map(function(c){ return '- '+c+'.'; }).join('\n')
      : 'PROCEDIMIENTO SIN COMPLICACIONES.';

  var header = 'PACIENTE HEMODIN\u00c1MICAMENTE ESTABLE.\n'
    + 'SE EXPLICAN RIESGOS Y POSIBLES COMPLICACIONES DEL PROCEDIMIENTO'
    + (isArt
      ? ': ESPASMO ARTERIAL, HEMATOMA LOCAL, ISQUEMIA DISTAL, PUNCIÓN DE VENA ADYACENTE, INFECCIÓN Y FALLA DEL PROCEDIMIENTO.'
      : ': PUNCIÓN ARTERIAL INADVERTIDA, NEUMOTÓRAX, HEMOTÓRAX, HEMATOMA LOCAL, SANGRADO, EMBOLISMO AÉREO, ARRITMIAS, MALPOSICIÓN DEL CATÉTER, INFECCIÓN, TROMBOSIS Y FALLA DEL PROCEDIMIENTO.')
    + '\nCONSENTIMIENTO INFORMADO FIRMADO POR EL PACIENTE.\n';

  var raw = header + '\n';

  if (isArt) {
    raw += 'CATÉTER ARTERIAL RADIAL '+v.lado+' \u2014 ECOGUIADO.\n\n'
      + 'TEST DE ALLEN: '+v.test_allen+'.\n'
      + 'DECÚBITO SUPINO. MUÑECA EN HIPEREXTENSIÓN CON ROLLO DEBAJO.\n'
      + 'ASEPSIA / ANTISEPSIA. CAMPO ESTÉRIL.\n'
      + 'BAJO VISIÓN ECOGUIADA SE IDENTIFICA LA ARTERIA RADIAL Y SE REALIZA PUNCIÓN DIRECTA.\n'
      + 'ADECUADO FLUJO ARTERIAL. CATÉTER FIJO CON APÓSITO ESTÉRIL.\n'
      + 'FORMA DE ONDA ARTERIAL ADECUADA EN MONITOR.\n\n'
      + complStr;
  } else {
    var vena = isYug ? 'LA VENA YUGULAR INTERNA' : 'LA VENA SUBCLAVIA';
    var posicion = isYug
      ? 'DECÚBITO SUPINO. CABEZA GIRADA HACIA LADO CONTRARIO. TRENDELENBURG 15\u00b0.'
      : 'DECÚBITO SUPINO. CABEZA EN POSICIÓN NEUTRA. TRENDELENBURG 15\u00b0.';
    raw += titulo.toUpperCase()+' '+v.lado+' \u2014 ECOGUIADO.\nTÉCNICA DE SELDINGER.\n\n'
      + posicion + '\n'
      + 'ASEPSIA / ANTISEPSIA. CAMPO ESTÉRIL.\n'
      + 'BAJO VISIÓN ECOGUIADA SE IDENTIFICA '+vena+' Y SE REALIZA PUNCIÓN CON AGUJA DE ACCESO.\n'
      + 'ADECUADO RETORNO VENOSO. AVANCE DE GUÍA SIN RESISTENCIA.\n'
      + 'CATÉTER VENOSO CENTRAL '+v.lumenes+' LÚMENES INSERTADO A '+(v.cm_insercion||'15')+' CM.\n'
      + 'FLUJO ADECUADO EN TODOS LOS LÚMENES. FIJACIÓN CON SUTURA Y APÓSITO ESTÉRIL.\n'
      + 'VERIFICACIÓN DE POSICIÓN POR '+v.verificacion+'.\n\n'
      + complStr;
  }

  var note = applyCase(raw, S.caseMode);
  S.notes[cid] = note;
  var col2 = getCatColor();
  var wrap = document.getElementById('nw-' + cid);
  if (wrap) wrap.innerHTML = renderNoteWrap(note, cid, col2);
}

/* ════════════════════════════════════════════════════
   VENTILACIÓN PROTECTORA — Panel y cálculos
   Driving pressure · Compliance · PCV-VG
════════════════════════════════════════════════════ */

function agbUpdateVentPanel(cardId) {
  var v = S.formVals['ag_balanceada']; if (!v) return;
  var pan = document.getElementById('agb-vent-panel-'+cardId); if (!pan) return;
  var col = getCatColor();

  /* PIB */
  var tallaCm = parseFloat(v.talla)||0;
  var agbEsF  = (v.sexo||'FEMENINO')==='FEMENINO';
  var pib     = tallaCm>0 ? Math.round((agbEsF?45.5:50)+0.91*(tallaCm-152.4)) : parseFloat(v.peso)||0;
  var vtMlKg  = parseFloat(v.vt_mlkg)||6;
  var vtMl    = Math.round(pib * vtMlKg);
  var peep    = parseFloat(v.peep)||5;
  var pPlateau= parseFloat(v.p_plateau)||0;
  var pPeak   = parseFloat(v.p_peak)||0;

  var dp  = pPlateau > 0 ? pPlateau - peep : null;
  var cst = (dp && dp > 0 && vtMl > 0) ? Math.round(vtMl / dp) : null;
  var cdyn= (pPeak > peep && vtMl > 0) ? Math.round(vtMl / (pPeak - peep)) : null;

  function badge(lbl, val, color, ok) {
    var clr = ok===true?'#059669':ok===false?'#DC2626':'#D97706';
    if (color) clr = color;
    return '<div style="background:'+clr+'12;border:1px solid '+clr+'40;border-radius:8px;padding:8px 10px;text-align:center">'+
      '<div style="font-size:9px;color:var(--t3);font-weight:700;text-transform:uppercase;margin-bottom:2px">'+lbl+'</div>'+
      '<div style="font-size:15px;font-weight:800;color:'+clr+'">'+val+'</div></div>';
  }

  var html = '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px">';

  /* Vt */
  var vtOk = vtMlKg >= 4 && vtMlKg <= 8;
  html += badge('Vt calculado', vtMl+' mL', vtOk?'#059669':'#D97706', vtOk);

  /* PIB */
  html += badge('PIB', pib+' kg', col, null);

  /* Vt/kg PIB */
  html += badge('Vt/kg PIB', vtMlKg+' mL/kg', vtOk?'#059669':'#D97706', vtOk);
  html += '</div>';

  if (pPlateau > 0 || pPeak > 0) {
    html += '<div style="display:grid;grid-template-columns:repeat('+(dp&&cst?3:2)+',1fr);gap:8px;margin-top:8px">';

    if (dp !== null) {
      var dpOk = dp <= 15; var dpWarn = dp <= 20;
      var dpClr = dpOk?'#059669':dpWarn?'#D97706':'#DC2626';
      var dpLabel = dpOk?'\u2713 ADECUADA':dpWarn?'\u26a0 ELEVADA':'\u26a0\ufe0f CR\u00cdTICA';
      html += '<div style="background:'+dpClr+'12;border:1px solid '+dpClr+'40;border-radius:8px;padding:8px 10px;text-align:center">'+
        '<div style="font-size:9px;color:var(--t3);font-weight:700;text-transform:uppercase;margin-bottom:2px">Driving Pressure</div>'+
        '<div style="font-size:15px;font-weight:800;color:'+dpClr+'">'+dp+' cmH\u2082O</div>'+
        '<div style="font-size:10px;color:'+dpClr+';font-weight:600">'+dpLabel+' (\u226415 cmH\u2082O)</div></div>';
    }

    if (cst !== null) {
      var cstOk = cst >= 40; var cstWarn = cst >= 30;
      var cstClr = cstOk?'#059669':cstWarn?'#D97706':'#DC2626';
      html += '<div style="background:'+cstClr+'12;border:1px solid '+cstClr+'40;border-radius:8px;padding:8px 10px;text-align:center">'+
        '<div style="font-size:9px;color:var(--t3);font-weight:700;text-transform:uppercase;margin-bottom:2px">Compliance Est\u00e1tica</div>'+
        '<div style="font-size:15px;font-weight:800;color:'+cstClr+'">'+cst+' mL/cmH\u2082O</div>'+
        '<div style="font-size:10px;color:'+cstClr+';font-weight:600">'+(cstOk?'\u2713 Normal':cstWarn?'\u26a0 Reducida':'\u26a0\ufe0f Muy reducida')+'</div></div>';
    }

    if (cdyn !== null) {
      var cdynOk = cdyn >= 50; var cdynWarn = cdyn >= 35;
      var cdynClr = cdynOk?'#059669':cdynWarn?'#D97706':'#DC2626';
      html += '<div style="background:'+cdynClr+'12;border:1px solid '+cdynClr+'40;border-radius:8px;padding:8px 10px;text-align:center">'+
        '<div style="font-size:9px;color:var(--t3);font-weight:700;text-transform:uppercase;margin-bottom:2px">Compliance Din\u00e1mica</div>'+
        '<div style="font-size:15px;font-weight:800;color:'+cdynClr+'">'+cdyn+' mL/cmH\u2082O</div>'+
        '<div style="font-size:10px;color:'+cdynClr+';font-weight:600">'+(cdynOk?'\u2713 Normal':cdynWarn?'\u26a0 Reducida':'\u26a0\ufe0f Muy reducida')+'</div></div>';
    }
    html += '</div>';

    /* Veredicto global */
    var allOk = dp!==null&&dp<=15 && (cst===null||cst>=40);
    var verdict = allOk
      ? '<div style="padding:8px 12px;background:#05966912;border:1px solid #05966930;border-radius:8px;font-size:11px;color:#059669;font-weight:700;margin-top:8px">\u2713 VENTILACI\u00d3N PROTECTORA ADECUADA \u2014 Vt \u22648 mL/kg PIB · DP \u226415 cmH\u2082O</div>'
      : '<div style="padding:8px 12px;background:#EF444412;border:1px solid #EF444430;border-radius:8px;font-size:11px;color:#DC2626;font-weight:700;margin-top:8px">\u26a0 REVISAR PAR\u00c1METROS \u2014 Reducir Vt o PEEP, titular seg\u00fan respuesta</div>';
    html += verdict;

    /* ── Recomendaciones clínicas ── */
    if (dp !== null && cst !== null) {
      var rec = [];

      /* Proyecciones: asumiendo compliance constante (Cst) */
      /* DP = Vt / Cst → Vt_target = DP_target × Cst */
      /* Pplateau = Vt/Cst + PEEP */

      if (dp > 15) {
        /* Opción 1: reducir Vt a 6 mL/kg */
        var vtTarget6 = Math.round(pib * 6);
        var dpWith6   = vtTarget6 > 0 && cst > 0 ? Math.round(vtTarget6 / cst) : null;
        if (dpWith6 !== null && dpWith6 < dp) {
          var dpOk6 = dpWith6 <= 15;
          rec.push({
            icon: dpOk6 ? '\u2713' : '\u2193',
            color: dpOk6 ? '#059669' : '#D97706',
            text: 'Reducir Vt a 6 mL/kg PIB (' + vtTarget6 + ' mL) \u2192 DP proyectado: ' + dpWith6 + ' cmH\u2082O' + (dpOk6 ? ' \u2713' : ' (mejorar\u00eda)')
          });
        }
        /* Opción 2: PEEP +2 (asumiendo reclutamiento mejora compliance +10%) */
        var cstRec   = Math.round(cst * 1.1);
        var dpWithPeep = vtMl > 0 && cstRec > 0 ? Math.round(vtMl / cstRec) : null;
        if (dpWithPeep !== null && dpWithPeep < dp) {
          rec.push({
            icon: dpWithPeep <= 15 ? '\u2713' : '\u2197',
            color: dpWithPeep <= 15 ? '#059669' : '#D97706',
            text: 'Subir PEEP +2 cmH\u2082O (PEEP ' + (peep+2) + ') + reclutamiento \u2192 DP estimado: ' + dpWithPeep + ' cmH\u2082O'
          });
        }
        /* Opción 3: Vt mínimo para DP ≤ 15 con compliance actual */
        if (cst > 0) {
          var vtForDp15 = Math.round(15 * cst);
          var mlkgForDp15 = pib > 0 ? (vtForDp15/pib).toFixed(1) : '?';
          rec.push({
            icon: '\u2192',
            color: '#0EA5E9',
            text: 'Vt m\u00e1ximo para DP \u226415 cmH\u2082O con C actual: ' + vtForDp15 + ' mL (' + mlkgForDp15 + ' mL/kg PIB)'
          });
        }
      }

      if (cst < 40) {
        rec.push({icon:'\u26a0', color:'#D97706',
          text:'Compliance reducida \u2014 descartar: atelectasia, edema pulmonar, hipertensi\u00f3n abdominal, neum\u00f3torax, intubaci\u00f3n selectiva'});
        if (peep < 8) {
          var dpWithPeep8 = vtMl > 0 && cst > 0 ? Math.round(vtMl / (cst * 1.15)) : null;
          rec.push({icon:'\u2197', color:'#0EA5E9',
            text:'Considerar PEEP 8 cmH\u2082O + maniobra de reclutamiento (PEEP 15\u00d740 seg, luego titular)'
            + (dpWithPeep8!==null ? ' \u2192 DP estimado: ' + dpWithPeep8 + ' cmH\u2082O' : '')
          });
        }
      }

      /* Diferencial pico vs meseta */
      if (cdyn !== null && cst !== null) {
        var rr = vtMl > 0 ? Math.round((1/cst - 1/cdyn) * vtMl) : 0;
        if (cdyn < cst * 0.75) {
          rec.push({icon:'\u26a0', color:'#EF4444',
            text:'Gran diferencia Pico\u2212Plateau (' + (pPeak ? Math.round(pPeak-pPlateau) : '?') + ' cmH\u2082O) \u2014 sugestivo de aumento de resistencia: broncospasmo, secreciones, tubo acodado'});
        }
      }

      if (rec.length > 0) {
        html += '<div style="margin-top:10px;padding:10px 12px;background:var(--sidebar);border:1px solid var(--border);border-radius:10px">';
        html += '<div style="font-size:9px;font-weight:800;text-transform:uppercase;color:var(--t3);margin-bottom:8px;letter-spacing:.08em">\uD83D\uDCA1 Recomendaciones para mejorar DP / Compliance</div>';
        rec.forEach(function(r) {
          html += '<div style="display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)">'
               + '<span style="font-size:13px;color:'+r.color+';flex-shrink:0">'+r.icon+'</span>'
               + '<span style="font-size:11px;color:var(--t1);line-height:1.4">'+r.text+'</span></div>';
        });
        html += '</div>';
      }
    }

  } else {
    html += '<div style="font-size:10px;color:var(--t3);margin-top:6px">Ingresa P. Plateau y P. Pico para calcular driving pressure y compliance</div>';
  }

  html += '<div style="font-size:10px;color:var(--t3);margin-top:6px">Ref: Vt 6-8 mL/kg PIB \xb7 DP \u226415 cmH\u2082O \xb7 C\u226540 mL/cmH\u2082O \xb7 PEEP 5-8 cmH\u2082O</div>';
  pan.innerHTML = html;
}



/* FiO2 real por dispositivo y flujo */
var FIO2_DEVICES = {
  'CÁNULA NASAL':              function(l){ return Math.min(20+4*l, 44); },
  'MASCARILLA SIMPLE':         function(l){ return l<=6?35:l<=7?40:l<=8?45:l<=9?55:60; },
  'MASCARILLA CON RESERVORIO': function(l){ return l<=10?80:l<=12?90:95; },
  'VENTURI 24%':               function(l){ return 24; },
  'VENTURI 28%':               function(l){ return 28; },
  'VENTURI 31%':               function(l){ return 31; },
  'VENTURI 35%':               function(l){ return 35; },
  'VENTURI 40%':               function(l){ return 40; },
  'VENTURI 60%':               function(l){ return 60; },
  'SIN O2 SUPLEMENTARIO':      function(l){ return 21; },
};
function calcFiO2(device, lmin){
  var fn=FIO2_DEVICES[device]; if(!fn) return 21;
  return fn(parseFloat(lmin)||3);
}

/* ════════════════════════════════════════════════════

   Reactive sections + note generation per technique

function agbUpdateTecnica(cid) {
  var v = S.formVals['ag_balanceada']; if (!v) return;
  var tipo = v.tipo_anestesia || 'AG BALANCEADA';
  var isTIVA = tipo === 'TIVA';
  var isSed  = tipo === 'SEDACIÓN';
  var isAGB  = !isTIVA && !isSed;

  /* Show / hide sections */
  [['agb-halo-sec-'+cid, isAGB],
   ['agb-tiva-sec-'+cid, isTIVA||isSed],
   ['agb-vent-mec-sec-'+cid, !isSed],
   ['agb-vent-esp-sec-'+cid, isSed]
  ].forEach(function(pair){
    var el=document.getElementById(pair[0]);
    if(el) el.style.display=pair[1]?'':'none';
  });

  /* Auto-set spontaneous ventilation for sedación */
  if (isSed) {
    v.modo_vent = 'ESPONTÁNEA';
    var modeEl = document.getElementById('agb-modo-vent-'+cid);
    if (modeEl) modeEl.value = 'ESPONTÁNEA';

}

/* ── generateAgBalanceada extension: maintenance note by technique ── */
function buildMaintNote(v, halo, ketInf, lidoInf) {
  var tipo = v.tipo_anestesia || 'AG BALANCEADA';
  var isTIVA = tipo === 'TIVA';
  var isSed  = tipo === 'SEDACIÓN';

  if (isSed) {
    var fio2Real = typeof calcFiO2==='function' ? calcFiO2(v.o2_device||'CÁNULA NASAL', v.o2_lmin||3) : 32;
    var sedLine = 'VENTILACIÓN ESPONTÁNEA CON ' + (v.o2_device||'CÁNULA NASAL')
                + ' A ' + (v.o2_lmin||3) + ' L/MIN (FiO\u2082 REAL \u2248 ' + fio2Real + '%).';
    var propMode = v.prop_mant_modo || 'TCI (CE mcg/mL)';
    var propLine = propMode.indexOf('TCI') >= 0
      ? '- PROPOFOL TCI CE ' + (v.prop_tci_modelo||'SCHNIDER') + ' ' + (v.prop_mant_dose||'2.0') + ' MCG/ML.'
      : propMode === 'NINGUNO' ? ''
      : '- PROPOFOL INFUSIÓN ' + (v.prop_mant_dose||'50') + ' ' + (propMode.indexOf('MCG')>=0?'MCG/KG/MIN':'MG/H') + '.';
    var remiMode = v.remi_mant_modo || 'TCI (CE ng/mL)';
    var remiLine = remiMode === 'NINGUNO' ? ''
      : remiMode.indexOf('TCI') >= 0
        ? '- REMIFENTANIL TCI CE ' + (v.remi_modelo||'ELEVELD') + ' ' + (v.remi_mant||'1.5') + ' NG/ML.'
        : '- REMIFENTANIL INFUSIÓN ' + (v.remi_mant||'0.1') + ' MCG/KG/MIN.';
    return sedLine
      + '\n\nINDUCCIÓN DE SEDACIÓN:\n' + propLine
      + '\n\nMANTENIMIENTO DE SEDACIÓN:\n' + propLine
      + (remiLine ? '\n' + remiLine : '')
      + (v.dex_mant && v.dex_mant !== 'NINGUNA' ? '\n- DEXMEDETOMIDINA ' + v.dex_mant + ' MCG/KG/HORA.' : '');
  }

  if (isTIVA) {
    var propMode2 = v.prop_mant_modo || 'TCI (CE mcg/mL)';
    var propTIVA = propMode2.indexOf('TCI') >= 0
      ? '- PROPOFOL TCI CE ' + (v.prop_tci_modelo||'SCHNIDER') + ' ' + (v.prop_mant_dose||'2.0') + ' MCG/ML.'
      : propMode2 === 'NINGUNO' ? ''
      : '- PROPOFOL INFUSIÓN ' + (v.prop_mant_dose||'50') + ' ' + (propMode2.indexOf('MCG')>=0?'MCG/KG/MIN':'MG/H') + '.';
    var remiMode2 = v.remi_mant_modo || 'TCI (CE ng/mL)';
    var remiTIVA = remiMode2 === 'NINGUNO' ? ''
      : remiMode2.indexOf('TCI') >= 0
        ? '- REMIFENTANIL TCI CE ' + (v.remi_modelo||'ELEVELD') + ' ' + (v.remi_mant||'2.5') + ' NG/ML.'
        : '- REMIFENTANIL INFUSIÓN ' + (v.remi_mant||'0.1') + ' MCG/KG/MIN.';
    return 'MANTENIMIENTO (TIVA):\n'
      + propTIVA
      + (remiTIVA ? '\n' + remiTIVA : '')
      + ketInf + lidoInf
      + (v.dex_mant && v.dex_mant !== 'NINGUNA' ? '\n- DEXMEDETOMIDINA ' + v.dex_mant + ' MCG/KG/HORA.' : '');
  }

  /* Default: AG BALANCEADA */
  return 'MANTENIMIENTO:\n'
    + '- REMIFENTANIL MODO TCI CE ' + (v.remi_modelo||'ELEVELD') + ' ' + (v.remi_mant||'2.5') + ' EN NG/ML.\n'
    + halo + ketInf + lidoInf
    + (v.dex_mant && v.dex_mant !== 'NINGUNA' ? '- DEXMEDETOMIDINA ' + v.dex_mant + ' MCG/KG/HORA.\n' : '');
}

/* ── STATE ── */
var S = {
  active: 'valoracion', dark: false, caseMode: 'UPPER',
  formMode: {}, search: '', formVals: {}, notes: {}
};

/* ── HELPERS ── */
function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function getC(){ return S.dark ? DARK_C : LIGHT_C; }
function getCatColor(){ return CAT_COL[S.active]; }

/* ── INIT FORM VALS ── */
function initFormVals(fk){
  var def=FORM_DEFS[fk]; if(!def) return;
  S.formVals[fk]={};
  def.fields.forEach(function(f){
    if(f.type==='select')  S.formVals[fk][f.key]=f.opts[0];
    else if(f.type==='number') S.formVals[fk][f.key]=String(f.def||'');
    else if(f.type==='text')   S.formVals[fk][f.key]='';
    else if(f.type==='check')  S.formVals[fk][f.key]=[];
    else if(f.type==='twin')   f.sub.forEach(function(s){ S.formVals[fk][s.k]=s.def||''; });
    else if(f.type==='vitals') ['tas','tad','fc','sat'].forEach(function(k){
      S.formVals[fk][f.key+'_'+k]='';
    });
  });
}
function setFV(fk,key,val){
  if(!S.formVals[fk]) initFormVals(fk);
  S.formVals[fk][key]=val;
}
function toggleChk(fk,key,el){
  if(!S.formVals[fk]) initFormVals(fk);
  var arr=S.formVals[fk][key]||[], val=el.dataset.v;
  if(arr.indexOf(val)>=0){
    S.formVals[fk][key]=arr.filter(function(x){return x!==val;});
    el.className='chk'; el.removeAttribute('style');
    el.querySelector('.chk-ico').textContent='☐';
  } else {
    S.formVals[fk][key]=arr.concat([val]);
    var col=el.dataset.col||'';
    el.style.cssText='color:'+col+';border-color:'+col+'80;background:'+col+'15;font-weight:700';
    el.querySelector('.chk-ico').textContent='☑';
  }
}

/* ── GENERATE + COPY ── */
function generateNote(fk, cardId){
  var def=FORM_DEFS[fk]; if(!def) return;
  if(!S.formVals[fk]) initFormVals(fk);
  var raw=def.gen(S.formVals[fk]);
  var note=applyCase(raw, S.caseMode);
  S.notes[cardId]=note;
  var wrap=document.getElementById('nw-'+cardId);
  var col=getCatColor();
  if(wrap) wrap.innerHTML=renderNoteWrap(note, cardId, col);
}
function renderNoteWrap(note, cardId, col){
  return '<div class="note-wrap">'+
    '<div class="note-hdr">'+
    '<span class="note-lbl">NOTA GENERADA</span>'+
    '<button class="copy-btn" id="ncopy-'+cardId+'" onclick="copyNote(\''+cardId+'\')"'+
    ' style="color:'+col+';border-color:'+col+'50;background:'+col+'12">'+
    '&#x2398; COPIAR NOTA</button></div>'+
    '<pre class="note-pre" onclick="selectNote(\'note-ta-'+cardId+'\')" title="Clic para seleccionar todo">'+esc(note)+'</pre>'+
    '<textarea id="note-ta-'+cardId+'" style="position:absolute;left:-9999px;opacity:0;pointer-events:none" aria-hidden="true">'+esc(note)+'</textarea>'+
    '</div>';
}
function selectNote(taId){
  var ta=document.getElementById(taId);
  if(!ta) return;
  ta.style.cssText='position:fixed;top:10px;left:50%;transform:translateX(-50%);width:90%;max-width:600px;height:200px;z-index:9999;font-size:12px;padding:10px;border:2px solid #059669;border-radius:8px;background:#fff;color:#111';
  ta.focus(); ta.select();
  setTimeout(function(){
    ta.style.cssText='position:absolute;left:-9999px;opacity:0;pointer-events:none';
  },4000);
}
function copyNote(cardId){
  var note=S.notes[cardId]; if(note) copyTxt(note,'ncopy-'+cardId);
}
function copyTxt(text, btnId){
  function markCopied(){
    var btn=document.getElementById(btnId);
    if(!btn) return;
    var orig=btn.innerHTML;
    btn.innerHTML='&#10003; &#161;COPIADO!';
    btn.style.color='#059669'; btn.style.borderColor='#05966960'; btn.style.background='#05966915';
    setTimeout(function(){btn.innerHTML=orig;btn.style.color='';btn.style.borderColor='';btn.style.background='';},2500);
  }
  function fallback(){
    var ta=document.createElement('textarea');
    ta.value=text; ta.style.cssText='position:fixed;top:0;left:0;opacity:0.01;z-index:9999';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{document.execCommand('copy');}catch(e){}
    document.body.removeChild(ta);
    markCopied();
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(markCopied).catch(fallback);
  } else { fallback(); }
}

     &&S.formVals['ucpa_ingreso'].proc===S.formVals['ag_balanceada'].proc){
    syncBanner='<div style="margin-bottom:12px;padding:8px 14px;border-radius:8px;background:#0EA5E912;border:1px solid #0EA5E935;font-size:11px;color:#0EA5E9;font-weight:600">'
      +'📋 Pre-llenado desde Registro Intraoperatorio — agrega SV de ingreso y Aldrete</div>';
  }
  var vals=S.formVals[fk];
  var h='<div class="form-gen">'+syncBanner+'<div class="form-grid">';
  def.fields.forEach(function(field){
    var full=['vitals','check','twin'].indexOf(field.type)>=0;
    h+='<div class="'+(full?'fld-full':'')+'"><label class="fg-lbl">'+esc(field.label)+'</label>';
    h+=renderFormField(field, fk, vals, col);
    h+='</div>';
  });
  h+='</div>';
  h+='<button class="gen-btn" onclick="generateNote(\''+fk+'\',\''+cardId+'\')"'+
     ' style="background:linear-gradient(135deg,'+col+','+col+'CC);box-shadow:0 3px 12px '+col+'40">'+
     '&#9889; GENERAR NOTA</button>';
  var existingNote=S.notes[cardId]||'';
  h+='<div id="nw-'+cardId+'">'+(existingNote?renderNoteWrap(existingNote,cardId,col):'')+'</div>';
  h+='</div>';


  return h;
}

function renderFormField(field, fk, vals, col){
  var v=vals[field.key]!==undefined?vals[field.key]:'';
  var fc='onfocus="this.style.borderColor=\''+col+'\'" onblur="this.style.borderColor=\'\'"';
  if(field.type==='select'){
    var opts=''; field.opts.forEach(function(o){
      opts+='<option value="'+esc(o)+'"'+(vals[field.key]===o?' selected':'')+'>'+esc(o)+'</option>';
    });
    return '<select class="f-select" '+fc+' onchange="setFV(\''+fk+'\',\''+field.key+'\',this.value)">'+opts+'</select>';
  }
  if(field.type==='number'){
    return '<div class="f-input-wrap"><input type="number" class="f-input" '+fc+' value="'+esc(v)+'"'+
           ' oninput="setFV(\''+fk+'\',\''+field.key+'\',this.value)">'+
           (field.unit?'<span class="f-unit">'+esc(field.unit)+'</span>':'')+'</div>';
  }
  if(field.type==='text'){
    return '<input type="text" class="f-input" '+fc+' value="'+esc(v)+'"'+
           ' placeholder="'+esc(field.ph||'')+'" oninput="setFV(\''+fk+'\',\''+field.key+'\',this.value)">';
  }
  if(field.type==='vitals'){
    var vg='<div class="vitals-g">';
    [['tas','PAS (mmHg)'],['tad','PAD (mmHg)'],['fc','FC (lpm)'],['sat','SpO2 (%)']].forEach(function(pair){
      var k=field.key+'_'+pair[0];
      vg+='<div><div class="v-lbl">'+pair[1]+'</div>'+
          '<input type="number" class="f-input" '+fc+' style="text-align:center" placeholder="___" value="'+esc(vals[k]||'')+'"'+
          ' oninput="setFV(\''+fk+'\',\''+k+'\',this.value)"></div>';
    });
    return vg+'</div>';
  }
  if(field.type==='twin'){
    var tg='<div class="twin-g">';
    field.sub.forEach(function(s){
      tg+='<div><div class="t-lbl">'+esc(s.lbl)+' ('+esc(s.unit)+')</div>'+
          '<input type="number" step="0.5" class="f-input" '+fc+' value="'+esc(vals[s.k]||'')+'"'+
          ' oninput="setFV(\''+fk+'\',\''+s.k+'\',this.value)"></div>';
    });
    return tg+'</div>';
  }
  if(field.type==='check'){
    var arr=vals[field.key]||[], cg='<div class="check-g">';
    field.opts.forEach(function(opt){
      var chk=arr.indexOf(opt)>=0;
      cg+='<div class="chk'+(chk?'" style="color:'+col+';border-color:'+col+'80;background:'+col+'15;font-weight:700':'"')+
          ' data-v="'+esc(opt)+'" data-col="'+col+'"'+
          ' onclick="toggleChk(\''+fk+'\',\''+field.key+'\',this)">'+
          '<span class="chk-ico">'+(chk?'&#9745;':'&#9744;')+'</span> '+esc(opt)+'</div>';
    });
    return cg+'</div>';
  }
  return '';
}

/* ── MAIN RENDER ── */
function render(){
  document.getElementById('nav-list').innerHTML=renderSidebar();
  document.getElementById('main').innerHTML=renderMain();
}

/* ── INIT ── */
window.addEventListener('DOMContentLoaded', function(){
  document.getElementById('topbar-calcs').innerHTML=renderTopbarCalcs();

  document.getElementById('dark-toggle').addEventListener('click', function(){
    S.dark=!S.dark;
    document.documentElement.className=S.dark?'dark':'';
    this.textContent=S.dark?'\u2600\uFE0F':'\uD83C\uDF19';
    render();
  });

  document.getElementById('case-toggle').addEventListener('click', function(){
    S.caseMode=S.caseMode==='UPPER'?'SENTENCE':'UPPER';
    this.textContent=S.caseMode==='UPPER'?'AA MAY\u00DAS':'Aa Oraci\u00F3n';
    render();
  });

  render();
});







</script>
