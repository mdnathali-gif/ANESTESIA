<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>&#128137; Plantillas Anestesiolog&#237;a</title>
  <style>



*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1)}
:root{
  --bg:#F8FAFC;--surf:#FFFFFF;--card:#FFFFFF;--sidebar:#F1F5F9;
  --border:#E2E8F0;--t1:#0F172A;--t2:#475569;--t3:#94A3B8;
  --code-bg:#F8FAFF;--code-t:#1E3A5F;--code-bdr:#DBEAFE;
}
html.dark{
  --bg:#0D1117;--surf:#161B26;--card:#1C2333;--sidebar:#131924;
  --border:#2D3748;--t1:#F1F5F9;--t2:#94A3B8;--t3:#4A5568;
  --code-bg:#0B1120;--code-t:#7DD3FC;--code-bdr:#1E3A5F;
}
a{text-decoration:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--sidebar)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--t3)}

/* ── LAYOUT ── */
#app-wrap{display:flex;flex-direction:column;height:100vh}
#topbar{
  display:flex;align-items:center;height:56px;padding:0 20px;gap:10px;
  flex-shrink:0;background:var(--surf);border-bottom:1px solid var(--border);
  box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden
}
#app-body{display:flex;flex:1;overflow:hidden}
#sidebar{
  width:200px;background:var(--sidebar);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;padding:12px 8px
}
#main{flex:1;overflow-y:auto;padding:24px 32px;background:var(--bg)}

/* ── TOPBAR ── */
.logo-wrap{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-icon{
  width:34px;height:34px;border-radius:10px;font-size:16px;
  background:linear-gradient(135deg,#0EA5E920,#8B5CF620);
  border:1px solid #0EA5E940;display:flex;align-items:center;justify-content:center
}
.logo-title{font-weight:800;font-size:13px;letter-spacing:.04em}
.logo-sub{font-size:9px;color:var(--t3);letter-spacing:.08em;margin-top:1px}
.topbar-div{width:1px;height:28px;background:var(--border);flex-shrink:0}
#topbar-calcs{display:flex;gap:5px;overflow-x:auto;flex:1;padding:2px 0;align-items:center}
.tc-label{font-size:9px;color:var(--t3);font-weight:700;letter-spacing:.1em;white-space:nowrap;flex-shrink:0}
.tc-pill{
  flex-shrink:0;border-radius:20px;padding:3px 10px;font-size:9.5px;font-weight:600;
  letter-spacing:.04em;border:1px solid;transition:all .15s;white-space:nowrap
}
.tc-pill:hover{transform:translateY(-1px)}
.hdr-btn{
  flex-shrink:0;border-radius:8px;padding:5px 12px;cursor:pointer;
  font-size:10.5px;font-weight:700;letter-spacing:.05em;border:1px solid;
  background:transparent;transition:all .2s;font-family:inherit
}
.hdr-btn:hover{transform:translateY(-1px)}

/* ── SIDEBAR ── */
.nav-lbl{font-size:9px;color:var(--t3);font-weight:700;letter-spacing:.12em;padding:2px 8px 10px}
.nav-btn{
  width:100%;text-align:left;padding:9px 10px;margin-bottom:2px;
  background:transparent;border:none;border-left:3px solid transparent;
  border-radius:0 8px 8px 0;cursor:pointer;display:flex;align-items:center;
  gap:8px;transition:all .15s
}
.nav-btn:hover{background:rgba(0,0,0,.03)}
html.dark .nav-btn:hover{background:rgba(255,255,255,.04)}
.nav-icon{font-size:15px}
.nav-text{font-size:11.5px;flex:1;line-height:1.3}
.nav-count{font-size:9px;font-weight:700;padding:1px 5px;border-radius:20px;flex-shrink:0}
.nav-new{
  background:#F43F5E15;border:1px solid #F43F5E35;color:#F43F5E;
  font-size:8px;font-weight:800;padding:1px 4px;border-radius:20px;letter-spacing:.06em
}

/* ── SECTION HEADER ── */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:16px}
.sec-title-row{display:flex;align-items:center;gap:10px}
.sec-accent{width:4px;height:28px;border-radius:4px;flex-shrink:0}
.sec-title{font-weight:800;font-size:20px}
.sec-badge{font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;border:1px solid}
.sec-div{height:2px;border-radius:2px;margin-bottom:20px}
.search-wrap{position:relative}
.search-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);pointer-events:none}
#search-box{
  background:var(--surf);border:1px solid var(--border);border-radius:20px;
  padding:7px 14px 7px 30px;color:var(--t1);font-size:12px;width:180px;
  outline:none;font-family:inherit;transition:all .2s
}
.no-results{color:var(--t3);font-size:13px;padding:60px 0;text-align:center}

/* ── CARDS ── */
.card{
  margin-bottom:20px;background:var(--card);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
  transition:box-shadow .2s
}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1)}
.card-stripe{height:3px}
.card-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px;border-bottom:1px solid var(--border)
}
.card-trow{display:flex;align-items:center;gap:10px}
.card-icon{
  width:32px;height:32px;border-radius:8px;font-size:14px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center
}
.card-title{font-size:13.5px;font-weight:700;line-height:1.3}
.badge-new{
  font-size:8.5px;font-weight:800;padding:1px 6px;border-radius:20px;
  letter-spacing:.08em;margin-top:2px;display:inline-block;border:1px solid
}
.card-actions{display:flex;align-items:center;gap:6px}
.tab-btn{
  padding:4px 12px;font-size:9.5px;font-weight:700;letter-spacing:.06em;cursor:pointer;
  border:none;border-bottom:2px solid transparent;background:transparent;
  transition:all .15s;font-family:inherit
}
.copy-btn{
  display:inline-flex;align-items:center;gap:6px;border-radius:20px;
  padding:6px 16px;cursor:pointer;font-size:11px;font-weight:700;
  letter-spacing:.04em;border:1.5px solid;transition:all .2s;font-family:inherit;background:transparent
}
.copy-btn:hover{transform:translateY(-1px)}
.card-calcs{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  padding:10px 18px;border-bottom:1px solid var(--border);background:var(--sidebar)
}
.cc-lbl{font-size:9px;color:var(--t3);font-weight:700;letter-spacing:.1em;margin-right:2px}
.cc-pill{
  border-radius:20px;padding:3px 9px;font-size:10px;font-weight:600;
  text-decoration:none;border:1px solid;white-space:nowrap;transition:all .15s
}
.cc-pill:hover{transform:translateY(-1px)}
.tmpl-block{
  margin:14px 18px 16px;padding:16px 18px;
  font-family:'Courier New','Consolas',monospace;
  font-size:11.5px;line-height:1.8;color:var(--code-t);
  background:var(--code-bg);border-radius:10px;
  border:1px solid var(--code-bdr);white-space:pre;overflow-x:auto;display:block
}

/* ── FORM GENERATOR ── */
.form-gen{padding:14px 18px 18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:0}
.fg-lbl{display:block;font-size:9.5px;color:var(--t3);font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-bottom:4px}
.fld-full{grid-column:1/-1}
.f-input,.f-select{
  width:100%;padding:6px 9px;border-radius:7px;border:1px solid var(--border);
  background:var(--bg);color:var(--t1);font-size:11.5px;outline:none;font-family:inherit;transition:border-color .15s
}
.f-select{cursor:pointer}
.f-input-wrap{display:flex;align-items:center;gap:6px}
.f-unit{font-size:10px;color:var(--t3);white-space:nowrap}
.vitals-g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.v-lbl{font-size:9px;color:var(--t3);margin-bottom:3px}
.twin-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.t-lbl{font-size:9px;color:var(--t3);margin-bottom:3px}
.check-g{display:flex;flex-wrap:wrap;gap:6px}
.chk{
  display:inline-flex;align-items:center;gap:5px;cursor:pointer;
  background:var(--sidebar);border:1px solid var(--border);border-radius:6px;
  padding:4px 10px;font-size:10.5px;color:var(--t2);user-select:none;transition:all .15s
}
.gen-btn{
  margin-top:16px;color:#fff;border:none;border-radius:8px;padding:9px 24px;
  cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.05em;
  transition:all .2s;font-family:inherit
}
.gen-btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
.note-wrap{margin-top:14px}
.note-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.note-lbl{font-size:10px;color:var(--t3);font-weight:700;letter-spacing:.1em}
.note-pre{
  padding:14px 16px;font-family:'Courier New','Consolas',monospace;
  font-size:11.2px;line-height:1.78;color:var(--code-t);
  background:var(--code-bg);border-radius:10px;border:1px solid var(--code-bdr);
  white-space:pre-wrap;word-break:break-word;overflow-x:auto;display:block
}

        </style>
</head>

<script>

/* CASE CONVERSION */
const ABBREVS = ['EKG','SpO2','TA','FC','FR','PAM','SV','TCI','Ce','Cp','IOT',
  'LMA','ASA','RCRI','DASI','NSQIP','BIS','TEV','UCPA','UCI','CVC','PAI','SNG',

  'DM','EPOC','ERC','FA','TVP','TEP','LCR','QL','TAP','ESP','PECS','SAPB','PENG',
  'IPACK','CICO','VAD','ECM','EIAS','MSD','MSI','EVA','IV','IM','SC','PNI',
  'MCG','MG','ML','GR','CM','KG','NG','FCF','LEV','OMS','WHO','NEWS','GCS','RASS',
  'PADSS','OSA','TIVA','SIR','TOT','VCP','SATO2','PMI','HBPM','POP','LBM'];

function applyCase(text, mode) {
  if (!text) return text;
  if (mode === 'UPPER') return text.toUpperCase();
  let result = text.split('\n').map(line => {
    if (/^[\s=\u2500-\u257F\u2550-\u256C\u2580-\u259F\u25A0-\u25FF\u2022\u25B8\u2713\u2718]+$/.test(line.trim())) return line;
    let l = line.toLowerCase();
    l = l.replace(/^(\s*)([a-z\u00e0-\u00ff])/, (m,sp,c) => sp + c.toUpperCase());
    l = l.replace(/:\s+([a-z\u00e0-\u00ff])/g, (m,c) => ': ' + c.toUpperCase());
    l = l.replace(/\u2192\s+([a-z\u00e0-\u00ff])/g, (m,c) => '\u2192 ' + c.toUpperCase());
    return l;
  }).join('\n');
  ABBREVS.forEach(abbr => {
    const re = new RegExp('\\b' + abbr.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b', 'gi');
    result = result.replace(re, abbr);
  });
  result = result.replace(/\b(\d+)\s*(mg|ml|mcg|gr|kg|cm|ng|lpm|rpm|mmhg|min|%|ui|u)\b/gi,
    (m,n,u) => n + ' ' + u.toUpperCase());
  return result;
}

    gen:(f)=>`LISTA DE CHEQUEO OK, VALORACIÓN PREANESTÉSICA Y CONSENTIMIENTO INFORMADO FIRMADO. ASINTOMÁTICO CARDIOVASCULAR, ASINTOMÁTICO RESPIRATORIO.

/* ── Cálculo DASI→METs por interpolación ── */
function interpMETs(dasi) {
  var t = DASI_METS_TABLE;
  if (dasi <= t[0].dasi) return t[0].mets;
  if (dasi >= t[t.length-1].dasi) return t[t.length-1].mets;
  for (var i=1; i<t.length; i++) {
    if (dasi <= t[i].dasi) {
      var x0=t[i-1].dasi, y0=t[i-1].mets, x1=t[i].dasi, y1=t[i].mets;
      return y0 + (y1-y0)*(dasi-x0)/(x1-x0);
    }
  }
  return t[t.length-1].mets;
}

/* ── RCRI grupo+prob ── */
function rcriInfo(pts) {
  if (pts===0) return {grp:'I',  prob:'0.4%',            color:'#059669'};
  if (pts===1) return {grp:'II', prob:'0.9 (0.3-2.1)%',  color:'#D97706'};
  if (pts===2) return {grp:'III',prob:'6.6 (3.9-10.3)%', color:'#EA580C'};
  return             {grp:'IV', prob:'>11%',              color:'#DC2626'};
}

/* ── Auto-riesgo quirúrgico por nombre ── */
function autoRiesgoQx(cx) {
  var t = cx.toLowerCase();
  var alto = /aort|vascular mayor|esofagectom|pancreatectom|resec.pulmon|trasplante.hepat|hepatectom.mayor|cirugía.cardiaca/i;
  var bajo  = /endoscop|gastroscop|colonoscop|cistoscop|eco |evda|rmn|biopsia|catarata|derm|superf|herniorrafia|artroscop|extraccion dental|vasect|laparoscop|hemorroid|fistula.anal|mama|tiroid|paratiroid|parotid/i;
  if (alto.test(t)) return {label:'ALTO',       color:'#DC2626'};
  if (bajo.test(t))  return {label:'BAJO',       color:'#059669'};
  return                    {label:'INTERMEDIO', color:'#D97706'};
}

    /* AUB-HAS2 — auto-calculado */

  h += aubAuto.pts+' PTO'+(aubAuto.pts===1?'':'S')+' &mdash; '+aubAuto.ri.label+' &mdash; '+aubAuto.ri.prob+'</span></div>';
  h += '<div id="vf-aubhas2-det-'+cardId+'" style="font-size:10.5px;color:'+C.t2+';margin-bottom:10px;line-height:1.7">';
  h += aubAuto.crit.length ? aubAuto.crit.map(function(c){return '✓ '+c;}).join(' &bull; ') : 'Ninguno detectado aún';
  h += '</div>';
  h += '<div style="max-width:220px"><label class="fg-lbl">Hb preoperatoria (anemia si &lt; 12 g/dL)</label>';
  h += '<div class="f-input-wrap">';
  h += '<input type="number" step="0.1" min="0" max="20" class="f-input" '+fc
       +' value="'+esc(String(v.hb_preop||''))+'" placeholder="Ej. 11.5"'
       +' oninput="vfSet(\''+cardId+'\',\'hb_preop\',this.value);updateAubhas2Display(\''+cardId+'\')">';
  h += '<span class="f-unit">g/dL</span></div></div>';
  if(aubAuto.pts>=2) h += '<div style="margin-top:8px;padding:6px 10px;border-radius:7px;background:'+aubAuto.ri.color+'10;border:1px solid '+aubAuto.ri.color+'25;font-size:10.5px;color:'+aubAuto.ri.color+';font-weight:600">Considerar: cardioprotectores, ecocardiograma, interconsulta cardiología</div>';
  h += '</div>';

    /* Barthel / FRAIL / AWOL — siempre en formulario, en nota solo si > 70 años */
  var edadAniosVF = v.edad_unidad==='meses' ? (parseFloat(v.edad)||0)/12 : (parseFloat(v.edad)||0);
  if (edadAniosVF > 0 && edadAniosVF <= 70) {
    h += '<div style="margin-top:8px;padding:6px 12px;border-radius:7px;background:#0EA5E910;border:1px solid #0EA5E930;font-size:10.5px;color:#0EA5E9;font-weight:600">'
       +'ℹ Escalas funcionales completadas — se incluirán en la nota solo si el paciente tiene > 70 años</div>';
  }
  h += renderBarthelSection(cardId, col, C, v);

  /* ─ BLOQUE 4: VAD + AYUNO ─ */ h += '<div class="form-grid" style="margin-top:14px">';

  h += '<select class="f-select" '+fc+' onchange="vfSet(\''+cardId+'\',\'vad\',this.value)">';

  h += '</select></div>';
  h += '<div><label class="fg-lbl">Ayuno</label>';

  AYUNO_OPTS.forEach(function(o){ h += '<option'+(v.ayuno===o?' selected':'')+'>'+esc(o)+'</option>'; });
  h += '</select></div>';
  h += '</div>';

  /* Extras */
  h += '<div class="fld-full" style="margin-top:10px"><label class="fg-lbl">Recomendaciones adicionales (opcional)</label>';

  if (S.notes[cardId]) h += renderNoteWrap(S.notes[cardId], cardId, col);
  h += '</div>';

  h += '</div>'; /* /form-gen */

}

/* ── Setters con actualizaciones parciales del DOM ── */
function vfSet(cardId, key, value) {
  var v = S.formVals['valoracion'];
  if (!v) return;
  v[key] = value;

  /* Actualizaciones reactivas sin re-render completo */
  if (key === 'nombreCx') {
    var rq = value ? autoRiesgoQx(value) : {label:'INTERMEDIO', color:'#D97706'};
    var el = document.getElementById('vf-riesgo-'+cardId);
    if (el) {
      el.textContent = rq.label;
      el.style.color = rq.color;
      el.style.background = rq.color + '15';
      el.style.borderColor = rq.color + '40';
    }
  }
  if (['comorbilidades','edad','edad_unidad','tipoCx','proc','hb_preop'].indexOf(key)>=0) { setTimeout(function(){updateAubhas2Display(cardId);},0); }
  if (['edad','edad_unidad'].indexOf(key)>=0) { setTimeout(function(){updateAwolBadge(cardId);},0); }
  if (key === 'asa') {
    var det = document.getElementById('vf-asadetail-'+cardId);
    if (det) det.style.display = value === 'I' ? 'none' : '';
    /* update label */
    var lbl = det ? det.querySelector('label') : null;
    if (lbl) lbl.textContent = 'Motivo ASA ' + value + ' / Diagnóstico principal';
  }
}

function vfRcri(cardId, idx, checked) {
  var v = S.formVals['valoracion'];
  if (!v) return;
  v.rcri_chk[idx] = checked;
  var pts = 0;
  v.rcri_chk.forEach(function(c){ if(c) pts++; });
  var ri = rcriInfo(pts);
  var badge = document.getElementById('vf-rcri-badge-'+cardId);
  if (badge) {
    badge.innerHTML = pts+' PTOS &mdash; Grupo '+ri.grp+' &mdash; '+ri.prob;
    badge.style.color = ri.color;
    badge.style.background = ri.color + '18';
    badge.style.borderColor = ri.color + '40';
  }
}

function calcAUBHAS2Auto(v) {
  var pts=0, crit=[];
  var comor=(v.comorbilidades||[]);
  var hasCard=comor.some(function(c){return c.indexOf("CARDIOPATÍA ISQUÉMICA")>=0||c.indexOf("SÍNDROME CORONARIO")>=0;});
  var hasICC =comor.some(function(c){return c.indexOf("INSUFICIENCIA CARDÍACA")>=0;});
  if(hasCard){pts++;crit.push("Historia de cardiopatía isquémica");}
  if(hasCard||hasICC){pts++;crit.push("Angina / disnea de esfuerzo");}
  var ea=v.edad_unidad==="meses"?(parseFloat(v.edad)||0)/12:(parseFloat(v.edad)||0);
  if(ea>=75){pts++;crit.push("Edad ≥75 años ("+Math.round(ea)+" a)");}
  var hb=parseFloat(v.hb_preop)||0;
  if(hb>0&&hb<12){pts++;crit.push("Anemia Hb "+hb+" g/dL");}
  var proc=(v.proc||"").toLowerCase();
  if(/aort|vascular mayor|bypass|endarter|carot|iliaco|femoro/.test(proc)){pts++;crit.push("Cirugía vascular mayor");}
  if(v.tipoCx==="urgencias"){pts++;crit.push("Cirugía de urgencia");}
  return {pts:pts, crit:crit, ri:aubhas2Info(pts)};
}

function updateAubhas2Display(cardId) {
  var v=S.formVals["valoracion"];if(!v)return;
  var r=calcAUBHAS2Auto(v);
  var b=document.getElementById("vf-aubhas2-badge-"+cardId);
  if(b){b.innerHTML=r.pts+" PTO"+(r.pts===1?"":"S")+" &mdash; RIESGO "+r.ri.label+" &mdash; "+r.ri.prob;
    b.style.color=r.ri.color;b.style.background=r.ri.color+"18";b.style.borderColor=r.ri.color+"40";}
  var det=document.getElementById("vf-aubhas2-det-"+cardId);
  if(det){det.innerHTML=r.crit.length?r.crit.map(function(c){return "✓ "+c;}).join(" &nbsp;&bull;&nbsp; "):"Ninguno por ahora";}
}

function vfDasi(cardId, idx, checked) {
  var v = S.formVals['valoracion'];
  if (!v) return;
  v.dasi_chk[idx] = checked;
  var score = 0;
  v.dasi_chk.forEach(function(c,i){ if(c) score += DASI_ITEMS[i].val; });
  score = Math.round(score*100)/100;
  var metsVal = interpMETs(score);
  var mets = Math.round(metsVal*100)/100;
  var metsOk = metsVal >= 4;
  var badge = document.getElementById('vf-dasi-badge-'+cardId);
  if (badge) {
    badge.innerHTML = score.toFixed(2)+' pts &mdash; '+mets.toFixed(2)+' METs'+(score>0?(metsOk?' &mdash; &#10003; Adecuada':' &mdash; &#9888; Limitada'):'');
    badge.style.color = score===0?'#94A3B8':(metsOk?'#059669':'#EA580C');
    badge.style.background = score===0?'transparent':(metsOk?'#05966918':'#EA580C18');
    badge.style.borderColor = score===0?'transparent':(metsOk?'#05966940':'#EA580C40');
  }
}

function vfToggleExtra(cardId, el) {
  var v = S.formVals['valoracion'];
  if (!v) return;
  var arr = v.extras || [], val = el.dataset.v;
  if (arr.indexOf(val) >= 0) {
    v.extras = arr.filter(function(x){ return x !== val; });
    el.className = 'chk'; el.removeAttribute('style');
    el.querySelector('.chk-ico').textContent = '&#9744;';
  } else {
    v.extras = arr.concat([val]);
    var col = el.dataset.col || '';
    el.style.cssText = 'color:'+col+';border-color:'+col+'70;background:'+col+'12;font-weight:700';
    el.querySelector('.chk-ico').textContent = '&#9745;';
  }
}

/* ── Generate note ── */
function generateValoracion(cardId) {
  var v = S.formVals['valoracion'];
  if (!v) return;

  var dasiScore = 0;
  v.dasi_chk.forEach(function(c,i){ if(c) dasiScore += DASI_ITEMS[i].val; });
  dasiScore = Math.round(dasiScore*100)/100;
  var mets = Math.round(interpMETs(dasiScore)*100)/100;
  var dasiStr = dasiScore > 0
    ? (dasiScore.toFixed(2)+' PUNTOS — '+mets.toFixed(2)+' METS')
    : 'MAYOR A ___ METS';

  var rcriPts = 0;
  v.rcri_chk.forEach(function(c){ if(c) rcriPts++; });
  var ri = rcriInfo(rcriPts);

  var rq = v.nombreCx ? autoRiesgoQx(v.nombreCx) : {label:'INTERMEDIO'};
  var esF = v.sexo === 'Femenino';
  var prog = esF ? 'PROGRAMADA' : 'PROGRAMADO';
  var asint = esF ? 'ASINTOMÁTICA' : 'ASINTOMÁTICO';
  var asaLine = v.asaDetalle
    ? 'ASA '+v.asa+' POR '+v.asaDetalle.toUpperCase()
    : 'ASA '+v.asa;
  var cx = v.nombreCx ? v.nombreCx.toUpperCase() : '[PROCEDIMIENTO]';
  var extras = v.extras && v.extras.length ? '\n' + v.extras.join('\n') : '';

  /* Timestamp */
  var now = new Date();
  var ts = now.toLocaleDateString('es-CO',{day:'2-digit',month:'2-digit',year:'numeric'})+
           ' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');

  var edadStr = v.edad ? v.edad+' '+v.unidad : '___';
  var esMenor = (v.unidad==='años' && parseFloat(v.edad||99)<18) ||
                (v.unidad==='meses' && parseFloat(v.edad||999)<216);

  var esF=(v.sexo||'Femenino')==='Femenino';
  var progStr=esF?'PROGRAMADA':'PROGRAMADO';
  var asintStr=esF?'ASINTOMÁTICA':'ASINTOMÁTICO';
  var aubAuto2=calcAUBHAS2Auto(v);
  var barthelR=calcBarthel(v);
  var frailR=calcFrail(v);
  var awolR=calcAwol(v);
  var edadAniosGV = v.edad_unidad==='meses' ? (parseFloat(v.edad)||0)/12 : (parseFloat(v.edad)||0);
  var mostrarEscFunc = edadAniosGV > 70;
  var barthelStr = mostrarEscFunc ? 'ÍNDICE DE BARTHEL: '+barthelR.pts+'/100 — '+barthelR.label : '';
  var frailStr   = mostrarEscFunc ? 'FRAIL SCALE: '+frailR.pts+'/5 — '+frailR.label : '';
  var awolStr    = mostrarEscFunc ? 'AWOL SCORE: '+awolR.pts+'/4 — RIESGO '+awolR.label+' ('+awolR.prob+')' : '';

  var aubhasStr="AUB-HAS2: "+aubAuto2.pts+" PUNTO"+(aubAuto2.pts===1?"":"S")
    +" — RIESGO "+aubAuto2.ri.label+" ("+aubAuto2.ri.prob+")";

  var raw =
    'PACIENTE DE '+edadStr+', '+v.sexo.toUpperCase()+'. '+asaLine+'. '+prog+' PARA '+cx+'.\n'+
    (esMenor
      ? 'MADRE NIEGA CIANOSIS O SÍNCOPE CON EJERCICIO, NO PALPITACIONES, NO DIAFORESIS CON ACTIVIDAD FÍSICA. NIEGA TOS, ODINOFAGIA, FIEBRE.'
      : asint+' CARDIOVASCULAR (NIEGA DISNEA, ORTOPNEA, PALPITACIONES, DOLOR TORÁCICO, SÍNCOPE O CLAUDICACIÓN). NIEGA TOS, ODINOFAGIA, FIEBRE.')
    +'\n'+
    'DASI: '+dasiStr+'.\n'+
    'REVISED CARDIAC RISK INDEX '+rcriPts+' PTO'+(rcriPts===1?'':'S')+
    ' - GRUPO PRONÓSTICO '+ri.grp+
    ' - PROBABILIDADES DE COMPLICACIONES CARDIACAS MAYORES PERIOPERATORIAS. '+ri.prob+'\n'+
    aubhasStr+'\n'+(mostrarEscFunc?'\n'+barthelStr+'\n'+'\n'+frailStr+'\n'+'\n'+awolStr+'\n':'')+
    progStr+' PARA PROCEDIMIENTO DE RIESGO '+rq.label+'.\n'+
    v.vad+'.\n'+
    'PUEDE SER '+progStr+'.\n'+
    v.ayuno+extras+'\n'+
    (esMenor
      ? 'SE EXPLICA A LOS ACUDIENTES DEL MENOR LA TÉCNICA ANESTÉSICA, RIESGOS Y POSIBLES COMPLICACIONES. SE FIRMA CONSENTIMIENTO INFORMADO. FECHA Y HORA: '+ts+'.'
      : 'SE EXPLICA TÉCNICA ANESTÉSICA PARA PROCEDIMIENTO QUIRÚRGICO, RIESGOS Y POSIBLES COMPLICACIONES ANESTÉSICAS. PACIENTE ENTIENDE, ACEPTA Y FIRMA CONSENTIMIENTO ANESTÉSICO. FECHA Y HORA: '+ts+'.');

  var note = applyCase(raw, S.caseMode);
  S.notes[cardId] = note;
  var col = getCatColor();
  var wrap = document.getElementById('nw-'+cardId);
  if (wrap) wrap.innerHTML = renderNoteWrap(note, cardId, col);
}


/* ============================================================
   AG BALANCEADA — Formulario Inteligente v3
   Auto-calc: propofol, rocuronio, lidocaína, ketamina, dex,
   TOT/LMA, reversión NMB, líquidos+sangrado, dosis pediátricas
============================================================ */

var AGB_EXP = {
  'ÉRAS / Ambulatoria (sin exposición)': 0,
  'Laparosc\u00f3pica / Endosc\u00f3pica': 1,
  'Abierta menor (herniorrafia, mastectom\u00eda)': 4,
  'Abierta moderada (laparotom\u00eda, colectom\u00eda)': 6,
  'Abierta mayor (hepatectom\u00eda, p\u00e1ncreas)': 8,
  'Cirug\u00eda vascular mayor': 10,
  'ERAS Ambulatoria (1 mL/kg/h — sin réplica de ayuno)': 1
};;

/* Input handler via data-attrs — avoids all escaping issues */
function agbInput(el) {
  var cid = el.dataset.cid, key = el.dataset.key;
  if (cid && key) {
    agbSet(cid, key, el.value);
    /* Recalculate vent panel when any vent parameter changes */
    var ventKeys=['vt_mlkg','talla','peep','fr','fio2_vent','peso','sexo','p_plateau','p_peak'];
    if (ventKeys.indexOf(key) >= 0) {
      setTimeout(function(){if(typeof agbUpdateVentPanel==="function") agbUpdateVentPanel(cid);}, 0);
    }
  }
}

function agbHolliday(p) {
  if (!p||p<=0) return 0;
  if (p<=10) return 4*p; if (p<=20) return 40+2*(p-10); return 60+(p-20);
}
function agbSangML(s) {
  if (!s||s==='ESCASO') return 0;
  var m=String(s).match(/(\d+)/); return m?parseInt(m[1]):0;
}
function agbCalcFluidos(v) {
  var p=parseFloat(v.peso)||0, ay=parseFloat(v.ayuno_h)||0,
      dur=parseFloat(v.dur_min)||60, ek=v.tipo_exp||Object.keys(AGB_EXP)[0],
      er=AGB_EXP[ek]||2, dh=dur/60, mn=agbHolliday(p),
      esRest=er<=1,
      def=esRest?0:mn*ay, exp=er*p*dh, mnt=mn*dh, sml=agbSangML(v.sangrado), rep=sml*3;
  var base=Math.round(def+exp+mnt);
  return {peso:p,mant:Math.round(mn),deficit:Math.round(def),esRestrictivo:esRest,expTot:Math.round(exp),
    base:base,repoSang:rep,total:Math.max(base+rep, p>0?250:0),sangML:sml,
    h1:Math.round(def*0.5+er*p+mn), h2:Math.round(def*0.25+er*p+mn)};
}
function calcTOT(ea) {
  if (ea<0.5) return {cc:'3.0',sc:'3.0',prof:9};
  if (ea<1)   return {cc:'3.5',sc:'3.5',prof:10};
  if (ea<2)   return {cc:'4.0',sc:'4.5',prof:11};
  var cc=Math.round((ea/4+3.5)*2)/2, sc=Math.round((ea/4+4)*2)/2;
  return {cc:cc.toFixed(1),sc:sc.toFixed(1),prof:Math.round(ea/2+12)};
}
function calcLMA(p) {
  if (p<5) return '1'; if (p<10) return '1.5'; if (p<20) return '2';
  if (p<30) return '2.5'; if (p<50) return '3'; if (p<70) return '4';
  if (p<=100) return '5'; return '6';
}
function agbDoses(p, ea, esSIR) {
  var esPed=ea>0&&ea<18, eMay=ea>=65;
  var propKg=esPed?3:(eMay?0.9:1.8);
  function r10(x){return x>=10?Math.round(x/10)*10:Math.round(x*10)/10;}
  return {esPed:esPed, eMay:eMay,
    propKg:propKg, propMg:r10(p*propKg),
    rocMg:r10(p*(esSIR?1.2:0.6)), rocKg:esSIR?1.2:0.6,
    lidoMg:r10(p*1.5), ketaMg:r10(p*0.3),
    dexMcg:Math.round(p*0.3/10)*10,
    paracetamol:esPed?Math.min(Math.round(p*15),1000):null,
    diclofenaco:esPed?Math.round(p*1):null,
    dipirona:esPed?Math.round(p*20):null,
    tramadol:Math.round(p*1*10)/10,
    ketorolaco:Math.min(Math.round(p*0.5*10)/10,30),
    meperidina:Math.round(p*0.5*10)/10,
    oxicodona:Math.round(p*0.1*100)/100,
    hidromorfona:Math.round(p*0.015*100)/100,
    dexaAnt:esPed?Math.min(Math.round(p*0.15*10)/10,8):null,
    ondPed:esPed?Math.min(Math.round(p*0.1*10)/10,4):null};
}
function agbRevDoses(p, tipo, tof) {
  if (!p||tipo==='NO REQUIRI\u00d3') return null;
  if (tipo==='SUGAMMADEX') {
    var td={'TOF 0 \u2014 BLOQUEO PROFUNDO (16 MG/KG)':16,'TOF 1-2 RESPUESTAS (4 MG/KG)':4,'TOF 3-4 / RATIO < 0.9 (2 MG/KG)':2};
    var mk=td[tof]||2;
    return {tipo:'SUGAMMADEX',mgKg:mk,mg:Math.round(p*mk),tof:tof};
  }
  if (tipo==='NEOSTIGMINA + ATROPINA')
    return {tipo:'NEOSTIGMINA',neoMg:Math.min(Math.round(p*0.05*100)/100,5),atrMg:Math.round(p*0.02*100)/100,neoKg:0.05,atrKg:0.02};
  return null;
}

function agbInit() {
  if (!S.formVals['ag_balanceada']) S.formVals['ag_balanceada'] = {

function agbSet(cid, key, val) {
  agbInit();
  var v=S.formVals['ag_balanceada']; v[key]=val;
  if (['peso','edad','edad_unidad','tipo_ind','va_tipo'].indexOf(key)>=0) agbCalcAll(cid);
  if (key==='tipo_anestesia') setTimeout(function(){agbUpdateTecnica(cid);},0);
  var _ventTriggers=['vt_mlkg','talla','peep','sexo','modo_vent','p_plateau','p_peak','fr','fio2_vent'];
  if (_ventTriggers.indexOf(key)>=0) setTimeout(function(){if(typeof agbUpdateVentPanel==="function") agbUpdateVentPanel(cid);},0);
  if (['ayuno_h','tipo_exp','dur_min','peso','sangrado'].indexOf(key)>=0) agbUpdateFluidos(cid);
  if (['reversion','tof_estado'].indexOf(key)>=0) agbUpdateRev(cid);

function agbCalcAll(cid) {
  agbInit();
  var v=S.formVals['ag_balanceada'];
  var p=parseFloat(v.peso)||0; if (!p) return;
  var ea=v.edad_unidad==='meses'?(parseFloat(v.edad)||0)/12:(parseFloat(v.edad)||0);
  var esSIR=v.tipo_ind&&v.tipo_ind.indexOf('1.2')>=0;
  var d=agbDoses(p,ea,esSIR);
  v.prop_dose=String(d.propMg); v.rocuronio=String(d.rocMg);
  v.lidocaina=String(d.lidoMg); v.ketamina_ind=String(d.ketaMg); v.dex_ind_dose=String(d.dexMcg);
  var esLMA=v.va_tipo&&v.va_tipo.indexOf('LMA')>=0;
  if (esLMA) { v.tot_size=calcLMA(p); }
  else if (d.esPed&&ea>0) { var tot=calcTOT(ea); v.tot_size=tot.cc; v.tot_cm=String(tot.prof); }
  function upd(id,val2){ var el=document.getElementById(id+'-'+cid); if(el) el.value=val2; }
  upd('agb-prop',d.propMg); upd('agb-roc',d.rocMg); upd('agb-lido',d.lidoMg);
  upd('agb-keta',d.ketaMg); upd('agb-dex',d.dexMcg);
  upd('agb-totsize',v.tot_size); upd('agb-totcm',v.tot_cm);
  agbRenderBadges(cid,d,ea,esSIR,p);
  agbUpdateFluidos(cid); agbUpdateRev(cid);
}

/* ═══════════════════════════════════════════════════
   SINCRONIZACIÓN: AG Balanceada → UCPA Ingreso
═══════════════════════════════════════════════════ */
function syncAGBtoUCPA() {
  var agb = S.formVals['ag_balanceada'];
  if (!agb || !agb.proc) return;

  if (!S.formVals['ucpa_ingreso']) initFormVals('ucpa_ingreso');
  var ucpa = S.formVals['ucpa_ingreso'];

  var va = agb.va_tipo || 'TOT CONVENCIONAL';
  var esSIR = (agb.tipo_ind||'').indexOf('1.2') >= 0;
  var tecnica = 'ANESTESIA GENERAL BALANCEADA';
  if (esSIR) tecnica += ' - SECUENCIA DE INDUCCIÓN RÁPIDA';
  if (va.indexOf('LMA') >= 0) tecnica = 'ANESTESIA GENERAL BALANCEADA CON MASCARA LARINGEA';

  ucpa.proc     = agb.proc;
  ucpa.tecnica  = tecnica;
  ucpa.sangrado = agb.sangrado || ucpa.sangrado || 'ESCASO';
  ucpa.ringer   = agb.ringer   || ucpa.ringer   || '';
  ucpa.diuresis = agb.diuresis || ucpa.diuresis || '';

  /* Transferir medicamentos que también aplican en UCPA */
  var agbMeds = agb.meds || [];
  var ucpaMedOpts = [
    'DEXAMETASONA 8 MG IV',
    'DIPIRONA 2 GR + BB HIOSCINA 20 MG IV',
    'DIPIRONA 2.5 GR + BB HIOSCINA 20 MG IV',
    'PARACETAMOL 1 GR IV DILUIDO LENTO',
    'PARACETAMOL 1 GR IV (ALTERNATIVA AINES - RIESGO NEFROTOXICIDAD)',
    'DICLOFENACO 75 MG IV LENTO',
    'NEFOPAM (ACUPAN) 20 MG IV DILUIDO LENTO',
    'ONDANSETRON 4 MG IV','ONDANSETRON 8 MG IV',
    'SULFATO DE MG 500 MG IV DILUIDO LENTO',
    'ETILEFRINA ___ MG IV PARA PAM >= 70',
    'OXICODONA 2 MG','HIDROMORFONA 0.3 MG',
  ];

  var synced = [];
  agbMeds.forEach(function(am) {
    var amKey = am.trim().substring(0,14).toLowerCase().replace(/\s+/g,'');
    ucpaMedOpts.forEach(function(um) {
      var umKey = um.trim().substring(0,14).toLowerCase().replace(/\s+/g,'');
      if (amKey === umKey && synced.indexOf(um) < 0) synced.push(um);
    });
  });
  (ucpa.meds||[]).forEach(function(m){if(synced.indexOf(m)<0) synced.push(m);});
  ucpa.meds = synced;
}

    
function generateAgBalanceada(cid) {
  try {
  agbInit();
  var v=S.formVals['ag_balanceada'];
  var peso=parseFloat(v.peso)||0;
  var ea=v.edad_unidad==='meses'?(parseFloat(v.edad)||0)/12:(parseFloat(v.edad)||0);
  var esSIR=v.tipo_ind&&v.tipo_ind.indexOf('1.2')>=0;
  var esInhal=v.tipo_ind&&v.tipo_ind.indexOf('INHALA')>=0;
  var esLMA=(v.va_tipo||'').indexOf('LMA')>=0;
  var d=peso>0?agbDoses(peso,ea,esSIR):null;
  var fl=agbCalcFluidos(v);

  /* PIB + Vt */
  var tallaCm=parseFloat(v.talla)||0;
  var agbEsF2=(v.sexo||'FEMENINO')==='FEMENINO';
  var pib=tallaCm>0?Math.round((agbEsF2?45.5:50)+0.91*(tallaCm-152.4)):peso;
  var vtMlKg=parseFloat(v.vt_mlkg)||6;
  var vtMlNum=Math.round(pib*vtMlKg);

  /* Ringer: auto from fluidos if not manually set */
  var ringerVal=v.ringer||(fl.total>0?String(fl.total):'___');

  /* Gendered */
  var agbEsF=(v.sexo||'FEMENINO')==='FEMENINO';
  var agbProg=agbEsF?'PACIENTE PROGRAMADA PARA ':'PACIENTE PROGRAMADO PARA ';
  var cx=(v.proc||'[PROCEDIMIENTO]').toUpperCase();

  /* Doses */
  var lidoMg=v.lidocaina||d&&d.lidoMg||'___';
  var rocMg=v.rocuronio||d&&d.rocMg||'___';
  var ketaMg=v.ketamina_ind||d&&d.ketaMg||'___';
  var dexMcg=v.dex_ind_dose||d&&d.dexMcg||'___';
  var propMg=v.prop_dose||d&&d.propMg||'___';

  /* VA line */
  var va=v.va_tipo||'TOT CONVENCIONAL';
  var vaLine=esLMA
    ?'* MANEJO DE LA VA CON '+va+' N\u00ba '+(v.tot_size||'___')+', ADECUADO ACOPLE SIN EVIDENCIA DE FUGAS.'
    :'* MANEJO DE LA VA CON '+va+' '+(v.tot_size||'___')+' IOT CORMACK '+(v.cormack||'1')+', SE FIJA A '+(v.tot_cm||'20')+' CM CLD.';

  /* Induction */
  var indLine='';
  if (esInhal) {
    var guedelLine=v.guedel?'- SE INTRODUCE C\u00c1NULA DE GUEDEL N\u00ba '+v.guedel+' POR OBSTRUCCI\u00d3N DE V\u00cdA A\u00c9REA.\n':'';
    indLine='- INDUCCI\u00d3N INHALATORIA CON SEVORANE '+(v.sevo_pct||'8')+'% \u2014 VENTILACI\u00d3N ESPONT\u00c1NEA.\n'
      +guedelLine
      +'- UNA VEZ EN PLANO ADECUADO SE CANALIZA ACCESO VENOSO PERIF\u00c9RICO SIN COMPLICACIONES.\n'
      +'- LIDOCA\u00cdNA '+lidoMg+' MG IV.\n'
      +'- PROPOFOL '+propMg+' MG IV.\n'
      +'- REMIFENTANIL TCI CE '+(v.remi_modelo||'ELEVELD')+' '+(v.remi_ind||'4')+' NG/ML.\n'
      +'- ROCURONIO '+rocMg+' MG' + (esSIR?' — SIR':'')+'.\n'
      +(parseFloat(ketaMg)>0?'- KETAMINA '+ketaMg+' MG.\n':'')
      +'- DEXMEDETOMIDINA '+dexMcg+' MCG/KG EN '+(v.dex_ind_min||'5')+' MIN.\n';
  } else {
    indLine='- REMIFENTANIL TCI CE '+(v.remi_modelo||'ELEVELD')+' '+(v.remi_ind||'4')+' NG/ML.\n'
      +'- LIDOCA\u00cdNA '+lidoMg+' MG.\n'
      +((v.prop_tipo||'').indexOf('TCI')>=0
        ?'- PROPOFOL TCI CE '+propMg+' MCG/ML ['+((v.prop_tipo||'').indexOf('Eleveld')>=0?'ELEVELD':'SCHNIDER')+'].\n'
        :'- PROPOFOL '+propMg+' MG.\n')
      +'- ROCURONIO '+rocMg+' MG' + (esSIR?' — SIR':'')+'.\n'
      +(parseFloat(ketaMg)>0?'- KETAMINA '+ketaMg+' MG.\n':'')
      +'- DEXMEDETOMIDINA '+dexMcg+' MCG/KG EN '+(v.dex_ind_min||'5')+' MIN.\n';
  }

  /* Maintenance */
  var halo=(v.halogenado||'DESFLURANO')==='NINGUNO (TIVA)'
    ?'- PROPOFOL TCI CE ___ MCG/ML (TIVA).\n'
    :'- '+(v.halogenado||'DESFLURANO')+'% SEG\u00daN ESPIRADO EN EL ANALIZADOR DE GASES.\n';
  var ketInf=(v.ket_inf||'NINGUNA')!=='NINGUNA'?'- KETAMINA '+v.ket_inf+' (INFUSI\u00d3N CONTINUA).\n':'';
  var lidoInf=(v.lido_inf||'NINGUNA')!=='NINGUNA'?'- LIDOCA\u00cdNA '+v.lido_inf+' (INFUSI\u00d3N CONTINUA).\n':'';

  /* Ventilation */
  var modoVent=v.modo_vent||'VCV';
  var dp   = (parseFloat(v.p_plateau)>0) ? parseFloat(v.p_plateau)-(parseFloat(v.peep)||5) : null;
  var cst  = (dp&&dp>0&&vtMlNum>0) ? Math.round(vtMlNum/dp) : null;
  var cdyn = (parseFloat(v.p_peak)>0) ? Math.round(vtMlNum/(parseFloat(v.p_peak)-(parseFloat(v.peep)||5))) : null;
  var ventLine='MODO: '+modoVent
    +' | Vt: '+vtMlNum+' mL ('+vtMlKg+' mL/kg PIB)'
    +' | FR: '+(v.fr||'14')+' rpm'
    +' | PEEP: '+(v.peep||'5')+' cmH\u2082O'
    +' | FiO\u2082: '+(v.fio2_vent||'50')+'%'
    +' | I:E 1:2.'
  +(dp!==null?'\nDRIVING PRESSURE: '+dp+' cmH₂O'+(dp<=15?' (✓ PROTECTOR)':dp<=20?' (⚠ ELEVADO)':' (⚠️ CRÍTICO)'):'');
  if(cst!==null) ventLine+='\nCOMPLIANCE ESTÁTICA: '+cst+' mL/cmH₂O'+(cst>=40?' (✓ NORMAL)':cst>=30?' (⚠ REDUCIDA)':' (⚠️ MUY REDUCIDA)');
  var _ventLineDone=true;

  /* Reversal */
  var revLine='';
  var rev=peso>0&&typeof agbRevDoses==='function'?agbRevDoses(peso,v.reversion,v.tof_estado):null;
  if (rev) {

    +'* PROTECCI\u00d3N OCULAR, T\u00c9RMICA, EL\u00c9CTRICA Y DE ZONAS DE PRESI\u00d3N CON HIDROGELES DE PROTECCI\u00d3N.\n'
    +'\nINDUCCI\u00d3N:\n'+indLine

/* ── AUB-HAS2 Calculator ── */
var AUBHAS2_ITEMS = [
  {k:'h1', lbl:'Historia de cardiopatía (IAM previo, angioplastia, cirugía card., ICC, FA o valvulopatía mod/sev.)'},
  {k:'h2', lbl:'Síntomas de cardiopatía: angina o disnea'},
  {k:'a1', lbl:'Edad ≥ 75 años'},
  {k:'s1', lbl:'Anemia: hemoglobina < 12 g/dL'},
  {k:'s2', lbl:'Cirugía vascular'},
  {k:'s3', lbl:'Cirugía de urgencias / emergencias'},
];

function calcAUBHAS2(vals) {
  var pts=0;
  AUBHAS2_ITEMS.forEach(function(item){ if(vals['aub_'+item.k]) pts++; });
  var risk=pts<=1?{lbl:'BAJO',color:'#059669',prob:'<1%',desc:'No requiere evaluación cardiovascular adicional'}:
           pts<=3?{lbl:'INTERMEDIO',color:'#D97706',prob:'1-10%',desc:'Considerar evaluación funcional / cardiológica si aplica'}:
                  {lbl:'ALTO',color:'#DC2626',prob:'>10%',desc:'Evaluación cardiológica y optimización preop. recomendadas'};
  return {pts:pts, risk:risk};
}

function aubToggle(fk, key, el) {
  if(!S.formVals[fk]) return;
  S.formVals[fk]['aub_'+key] = !S.formVals[fk]['aub_'+key];
  var chk = S.formVals[fk]['aub_'+key];
  var col = el.dataset.col||'';
  if(chk){
    el.style.cssText='color:'+col+';border-color:'+col+'70;background:'+col+'12;font-weight:700';
    el.querySelector('.chk-ico').textContent='☑';
  } else {
    el.className='chk'; el.removeAttribute('style');
    el.querySelector('.chk-ico').textContent='☐';
  }
  // Update score badge
  var result=calcAUBHAS2(S.formVals[fk]);
  var badge=document.getElementById('aub-badge-'+fk);
  if(badge){
    badge.textContent=result.pts+' PTS — '+result.risk.lbl+' ('+result.risk.prob+')';
    badge.style.color=result.risk.color;
    badge.style.background=result.risk.color+'18';
    badge.style.borderColor=result.risk.color+'40';
  }
  var desc=document.getElementById('aub-desc-'+fk);
  if(desc) desc.textContent=result.risk.desc;
}

function calcBarthel(v) {
  var pts=0;
  (v.barthel_vals||BARTHEL_ITEMS.map(function(i){return i.opts[0];})).forEach(function(x){pts+=parseInt(x)||0;});
  if(pts>=100) return {pts:pts,label:'INDEPENDIENTE',      color:'#059669'};
  if(pts>=91)  return {pts:pts,label:'DEPENDENCIA LEVE',   color:'#0EA5E9'};
  if(pts>=61)  return {pts:pts,label:'DEPENDENCIA MODERADA',color:'#D97706'};
  if(pts>=21)  return {pts:pts,label:'DEPENDENCIA SEVERA', color:'#EF4444'};
  return               {pts:pts,label:'DEPENDENCIA TOTAL', color:'#DC2626'};
}

function calcFrail(v) {
  var pts=(v.frail_chk||[]).filter(Boolean).length;
  if(pts===0) return {pts:pts,label:'ROBUSTO',    color:'#059669'};
  if(pts<=2)  return {pts:pts,label:'PRE-FRÁGIL', color:'#D97706'};
  return              {pts:pts,label:'FRÁGIL',     color:'#DC2626'};
}

function calcAwol(v) {
  var ea=v.edad_unidad==='meses'?(parseFloat(v.edad)||0)/12:(parseFloat(v.edad)||0);
  var ageChk = ea>=80 ? 1 : 0;
  var manualPts=(v.awol_chk||[0,0,0]).filter(Boolean).length;
  var pts=ageChk+manualPts;
  var probs=['2%','5%','16%','37%'];
  var labels=['MUY BAJO','BAJO','MODERADO','ALTO'];
  var colors=['#059669','#0EA5E9','#D97706','#DC2626'];
  var idx=Math.min(pts,3);
  return {pts:pts,ageChk:ageChk,label:labels[idx],prob:probs[idx],color:colors[idx]};
}

/* ════════════════════════════════════════════════════
   PERIDURAL TDP — Formulario con auto-cálculo catéter
   BLOQUEOS — Calculadora de mezcla + aguja
════════════════════════════════════════════════════ */

/* ── Calculadora de mezcla anestésica ────────────── */
function calcMezcla(concPct, volAL, volDil) {
  var concD = parseFloat(concPct)/100 || 0;
  var vAL   = parseFloat(volAL)   || 0;
  var vDil  = parseFloat(volDil)  || 0;
  var total = vAL + vDil;
  if (!vAL || !concD) return null;
  var concFinal = (concD * vAL) / (total || vAL);
  var mgTotal   = concD * vAL * 1000 / 10; // mg = conc(g/100mL) × vol(mL) × 10
  return {
    total: total || vAL,
    concPct: (concFinal * 100).toFixed(3),
    mgTotal: Math.round(mgTotal * 10) / 10,
  };
}

function vfPeridural(cid, key, val) {
  if (!S.formVals['peridural_tdp']) S.formVals['peridural_tdp'] = {};
  var v = S.formVals['peridural_tdp'];
  v[key] = val;
  /* Auto-calc catéter: espacio + 5 cm */
  if (key === 'prof') {
    var p = parseFloat(val) || 0;
    if (p > 0 && !v._cate_manual) {
      v.cate = String(p + 5);
      var cateEl = document.getElementById('vf-cate-' + cid);
      if (cateEl) cateEl.value = p + 5;
    }
  }
  if (key === 'cate') v._cate_manual = (val !== '');
  /* Auto-calc mezcla */
  if (['conc_al','vol_al','vol_dil'].indexOf(key) >= 0) updateMezcla(cid);
}

function updateMezcla(cid) {
  var v = S.formVals['peridural_tdp'] || {};
  var r = calcMezcla(v.conc_al, v.vol_al, v.vol_dil);
  var pan = document.getElementById('vf-mezcla-' + cid);
  if (!pan) return;
  var col = getCatColor();
  if (!r) {
    pan.innerHTML = '<span style="color:var(--t3);font-size:11px">Ingresa volúmenes para calcular</span>';
    return;
  }
  var hasDil = parseFloat(v.vol_dil) > 0;
  pan.innerHTML =
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px">' +
    mezclaBox('Volumen total', r.total + ' mL', col, true) +
    mezclaBox('Conc. final', r.concPct + '%', col, hasDil) +
    mezclaBox('Dosis total AL', r.mgTotal + ' mg', col, false) +
    '</div>';
}

function mezclaBox(lbl, val, col, hi) {
  return '<div style="background:'+(hi?col+'18':'var(--sidebar)')+';border:1px solid '+(hi?col+'50':'var(--border)')+
         ';border-radius:8px;padding:7px 10px;text-align:center">'+
         '<div style="font-size:9px;color:var(--t3);font-weight:700;text-transform:uppercase;margin-bottom:2px">'+lbl+'</div>'+
         '<div style="font-size:14px;font-weight:800;color:'+(hi?col:'var(--t1)')+'">'+val+'</div></div>';
}

/* ── Render peridural TDP form ─────────────────────── */
function renderPeridualForm(cid, col, C) {
  if (!S.formVals['peridural_tdp']) S.formVals['peridural_tdp'] = {};
  var v = S.formVals['peridural_tdp'];
  var fc = 'onfocus="this.style.borderColor=\''+col+'\'" onblur="this.style.borderColor=\'\'"';

  function ni(id, key, val, ph, unit) {
    var s = '<div class="f-input-wrap"><input type="number" id="'+id+'-'+cid+'" class="f-input" '+fc+
      ' value="'+esc(String(val||''))+'" placeholder="'+(ph||'')+'"'+

    if (unit) s += '<span class="f-unit">'+unit+'</span>';

  function ti(key, val, ph) {
    return '<input type="text" class="f-input" '+fc+' value="'+esc(String(val||''))+'" placeholder="'+(ph||'')+'"'+
      ' data-cid="'+cid+'" data-key="'+key+'" oninput="vfPeridural(this.dataset.cid,this.dataset.key,this.value)">';

  h += '</div>';

  /* Mezcla analgésica */

  h += '<div>'+lbl('Levobupivacaína 0.15%')+ni('x','levo_vol',v.levo_vol||96,'___','mL')+'</div>';

  h += '<div>'+lbl('Bolo inicial')+ni('x','bolo_vol',v.bolo_vol||10,'___','mL de mezcla')+'</div>';
  h += '<div>'+lbl('Infusión continua')+ni('x','inf_rate',v.inf_rate||8,'___','mL/h')+'</div>';
  h += '</div>';

  /* Calculadora mezcla dilución */
  h += sec('🧪 Calculadora de Dilución (opcional)');
  h += '<div class="form-grid">';
  h += '<div>'+lbl('Anestésico local (concentración %)');
  h += '<div class="f-input-wrap"><input type="number" step="0.01" class="f-input" '+fc+
       ' value="'+esc(String(v.conc_al||''))+'" placeholder="Ej. 0.75"'+
       ' data-cid="'+cid+'" data-key="conc_al" oninput="vfPeridural(this.dataset.cid,\'conc_al\',this.value)">'+
       '<span class="f-unit">%</span></div></div>';
  h += '<div>'+lbl('Volumen AL')+ni('x','vol_al',v.vol_al||'','___','mL')+'</div>';
  h += '<div>'+lbl('Volumen diluyente (SSN / SSF)');
  h += '<div class="f-input-wrap"><input type="number" class="f-input" '+fc+
       ' value="'+esc(String(v.vol_dil||''))+'" placeholder="0"'+
       ' data-cid="'+cid+'" data-key="vol_dil" oninput="vfPeridural(this.dataset.cid,\'vol_dil\',this.value)">'+
       '<span class="f-unit">mL</span></div></div>';
  h += '</div>';
  h += '<div id="vf-mezcla-'+cid+'">';
  var r0 = calcMezcla(v.conc_al, v.vol_al, v.vol_dil);
  if (r0) {
    h += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px">'+
         mezclaBox('Volumen total', r0.total+' mL', col, true)+
         mezclaBox('Conc. final', r0.concPct+'%', col, true)+
         mezclaBox('Dosis total AL', r0.mgTotal+' mg', col, false)+'</div>';
  } else {
    h += '<div style="color:var(--t3);font-size:11px;padding:6px 0">Ingresa volúmenes para calcular dilución</div>';
  }
  h += '</div>';

  /* SV y FCF */
  h += sec('\uD83D\uDCCA Signos Vitales al Finalizar');
  h += '<div class="form-grid">';
  ['sv_tas','sv_tad','sv_fc','sv_sat'].forEach(function(k2){
    var labels={'sv_tas':'TAS (mmHg)','sv_tad':'TAD (mmHg)','sv_fc':'FC (lpm)','sv_sat':'SpO2 (%)'};
    h += '<div>'+lbl(labels[k2])+ni('x',k2,v[k2],'___')+'</div>';
  });
  h += '<div>'+lbl('FCF')+ni('x','fcf',v.fcf||140,'___','LPM')+'</div>';
  h += '</div>';

  /* Generar nota */

       ' onclick="generatePeridual(\''+cid+'\')">&#9889; GENERAR NOTA</button>';
  h += '<div id="nw-'+cid+'">';
  if (S.notes[cid]) h += renderNoteWrap(S.notes[cid],cid,col);
  h += '</div></div>';
  setTimeout(function(){updateMezcla(cid);},0);
  return h;
}

/* ════════════════════════════════════════════════════
   CALCULADORA DE MEZCLA DE ANESTÉSICOS LOCALES
   Soporta hasta 4 componentes + diluyente
════════════════════════════════════════════════════ */

var MEZCLA_DRUGS = [
  {label:'--- Seleccionar ---', concs:[]},
  {label:'Lidocaína',           concs:[0.5,1,1.5,2,4],  maxMgKg:4.5, color:'#0EA5E9'},
  {label:'Mepivacaína',         concs:[1,1.5,2,3],       maxMgKg:5,   color:'#8B5CF6'},
  {label:'Bupivacaína',         concs:[0.125,0.25,0.375,0.5,0.75], maxMgKg:2, color:'#EF4444'},
  {label:'Levobupivacaína',     concs:[0.125,0.25,0.375,0.5,0.75], maxMgKg:3, color:'#F59E0B'},
  {label:'Ropivacaína',         concs:[0.2,0.375,0.5,0.75,1],      maxMgKg:3.5, color:'#10B981'},
  {label:'SSN / SSF (diluyente)',concs:[0],  maxMgKg:null, color:'#6B7280'},
  {label:'Fentanilo 50 mcg/mL', concs:[0.005], maxMgKg:null, color:'#EC4899'},
];

function getMezclaState(cid) {
  if (!S.formVals['mezcla_al_'+cid]) {
    S.formVals['mezcla_al_'+cid] = {
      peso: '',
      rows: [
        {drug:'', conc:'', vol:''},
        {drug:'', conc:'', vol:''},
        {drug:'', conc:'', vol:''},
        {drug:'', conc:'', vol:''},
      ]
    };
  }
  return S.formVals['mezcla_al_'+cid];
}

function mezclaSetDrug(cid, row, drugLabel) {
  var v = getMezclaState(cid);
  v.rows[row].drug = drugLabel;
  var d = MEZCLA_DRUGS.find(function(x){return x.label===drugLabel;});
  if (d && d.concs.length === 1) {
    v.rows[row].conc = String(d.concs[0]);
  } else {
    v.rows[row].conc = '';
  }
  updateMezclaCalc(cid);
  /* Update conc select */
  var concSel = document.getElementById('mzc-conc-'+cid+'-'+row);
  if (concSel && d) {
    var opts = '<option value="">--- conc ---</option>';
    d.concs.forEach(function(c){
      opts += '<option value="'+c+'"'+(v.rows[row].conc==c?' selected':'')+'>'+c+'%</option>';
    });
    concSel.innerHTML = opts;
  }
}

function mezclaSetConc(cid, row, val) {
  getMezclaState(cid).rows[row].conc = val;
  updateMezclaCalc(cid);
}

function mezclaSetVol(cid, row, val) {
  getMezclaState(cid).rows[row].vol = val;
  updateMezclaCalc(cid);
}

function mezclaSetPeso(cid, val) {
  getMezclaState(cid).peso = val;
  updateMezclaCalc(cid);
}

function updateMezclaCalc(cid) {
  var v = getMezclaState(cid);
  var peso = parseFloat(v.peso) || 0;
  var pan = document.getElementById('mzc-result-'+cid);
  if (!pan) return;
  var col = getCatColor();

  /* Aggregate by drug name */
  var totalVol = 0;
  var byDrug = {};  /* {drugLabel: {mg, volAL, maxMgKg, color}} */

  v.rows.forEach(function(r) {
    var vol  = parseFloat(r.vol)  || 0;
    var conc = parseFloat(r.conc) || 0;
    if (!vol) return;
    totalVol += vol;
    if (!r.drug || r.drug === '--- Seleccionar ---') return;
    var mg = conc * vol * 10; /* conc% → g/100mL × vol × 10 = mg */
    var d  = MEZCLA_DRUGS.find(function(x){return x.label===r.drug;});
    if (!byDrug[r.drug]) byDrug[r.drug] = {mg:0, volAL:0, maxMgKg:d&&d.maxMgKg||null, color:d&&d.color||col};
    byDrug[r.drug].mg    += mg;
    byDrug[r.drug].volAL += vol;
  });

  if (totalVol === 0) {
    pan.innerHTML = '<div style="color:var(--t3);font-size:11px;padding:8px 0">Ingresa los componentes para calcular</div>';
    return;
  }

  function box(lbl, val, sub, hi, clr) {
    return '<div style="background:'+(hi?(clr||col)+'18':'var(--sidebar)')+';border:1px solid '+(hi?(clr||col)+'50':'var(--border)')+
           ';border-radius:8px;padding:8px 10px;text-align:center">'+
           '<div style="font-size:9px;color:var(--t3);font-weight:700;text-transform:uppercase;margin-bottom:2px">'+lbl+'</div>'+
           '<div style="font-size:14px;font-weight:800;color:'+(hi?(clr||col):'var(--t1)')+'">'+val+'</div>'+
           (sub?'<div style="font-size:9px;color:var(--t3)">'+sub+'</div>':'')+
           '</div>';
  }

  var html = '<div style="display:grid;grid-template-columns:repeat('+(Object.keys(byDrug).length+1)+',1fr);gap:8px;margin-top:10px">';
  html += box('VOLUMEN TOTAL', totalVol.toFixed(1)+' mL', '', true, col);

  Object.keys(byDrug).forEach(function(drugName) {
    var info = byDrug[drugName];
    var mgRound = Math.round(info.mg * 10) / 10;
    var maxMsg = '';
    if (info.maxMgKg && peso) {
      var maxMg = info.maxMgKg * peso;
      var pct   = Math.round(info.mg / maxMg * 100);
      maxMsg = pct + '% dosis máx (' + Math.round(maxMg) + ' mg)';
      if (pct > 80) maxMsg = '⚠ ' + maxMsg;
    }
    html += box(drugName, mgRound+' mg', maxMsg || info.volAL.toFixed(1)+' mL', true, info.color);
  });

  html += '</div>';

  /* If only AL components (no SSN), show final conc if single drug type */
  var alDrugs = Object.keys(byDrug).filter(function(k){ return k!=='SSN / SSF (diluyente)' && k!=='Fentanilo 50 mcg/mL'; });
  if (alDrugs.length === 1) {
    var alInfo  = byDrug[alDrugs[0]];
    var concFin = (alInfo.mg / totalVol / 10).toFixed(3); /* g/100mL = % */
    html += '<div style="margin-top:8px;padding:6px 12px;border-radius:7px;background:'+col+'10;border:1px solid '+col+'30;font-size:11px;font-weight:700;color:'+col+'">';
    html += 'Concentración final de '+alDrugs[0]+': '+concFin+'%</div>';
  } else if (alDrugs.length > 1) {
    html += '<div style="margin-top:8px;padding:6px 12px;border-radius:7px;background:#F59E0B10;border:1px solid #F59E0B30;font-size:11px;color:#D97706">';
    html += '⚠ Mezcla de '+alDrugs.join(' + ')+' — verificar dosis totales individualmente</div>';
  }

  html += '<div style="font-size:10px;color:var(--t3);margin-top:6px">Dosis máx: Lido 4.5 mg/kg | Mepi 5 mg/kg | Bupi / Levo 2-3 mg/kg | Ropi 3.5 mg/kg</div>';
  pan.innerHTML = html;
}

/* ── Render calculator ──────────────────────────── */
function renderMezclaALForm(cid, col, C) {
  var v = getMezclaState(cid);
  var fc = 'onfocus="this.style.borderColor=\''+col+'\'" onblur="this.style.borderColor=\'\'"';
  var peso = parseFloat(v.peso) || 0;

  var h = '<div class="form-gen">';
  h += '<div style="font-size:9.5px;font-weight:800;letter-spacing:.1em;color:'+C.t3+';margin-bottom:14px;text-transform:uppercase">';
  h += '\uD83E\uDDEA Calculadora de Mezcla de Anest\u00e9sicos Locales</div>';

  /* Peso */
  h += '<div style="margin-bottom:14px;max-width:200px">';
  h += '<label class="fg-lbl">Peso del paciente</label>';
  h += '<div class="f-input-wrap"><input type="number" class="f-input" '+fc;
  h += ' value="'+esc(String(v.peso||''))+'" placeholder="kg"';
  h += ' oninput="mezclaSetPeso(\''+cid+'\',this.value)">';
  h += '<span class="f-unit">kg</span></div></div>';

  /* Table of components */
  h += '<div style="overflow-x:auto">';
  h += '<table style="width:100%;border-collapse:collapse;font-size:12px">';
  h += '<thead><tr style="border-bottom:2px solid '+col+'">';
  ['Componente','Conc. (%)','Volumen (mL)','Dosis (mg)'].forEach(function(lh){
    h += '<th style="text-align:left;padding:6px 10px;color:var(--t3);font-size:9px;font-weight:800;text-transform:uppercase">'+lh+'</th>';
  });
  h += '</tr></thead><tbody>';

  v.rows.forEach(function(r, i) {
    var vol = parseFloat(r.vol)||0, conc = parseFloat(r.conc)||0;
    var mg  = Math.round(conc * vol * 10 * 10)/10;
    var d   = MEZCLA_DRUGS.find(function(x){return x.label===r.drug;});
    var isDil = d && d.maxMgKg === null && d.label !== 'Fentanilo 50 mcg/mL';
    var clr = d ? d.color : 'var(--t3)';
    h += '<tr style="border-bottom:1px solid var(--border)">';

    /* Drug select */
    h += '<td style="padding:5px 8px"><select class="f-select" style="font-size:12px;min-width:160px" '+fc;
    h += ' onchange="mezclaSetDrug(\''+cid+'\','+i+',this.value)">';
    MEZCLA_DRUGS.forEach(function(drug){
      h += '<option value="'+esc(drug.label)+'"'+(r.drug===drug.label?' selected':'')+'>'+esc(drug.label)+'</option>';
    });
    h += '</select></td>';

    /* Conc select */
    h += '<td style="padding:5px 8px"><select id="mzc-conc-'+cid+'-'+i+'" class="f-select" style="font-size:12px;width:80px" '+fc;
    h += ' onchange="mezclaSetConc(\''+cid+'\','+i+',this.value)">';
    h += '<option value="">—</option>';
    if (d) d.concs.forEach(function(c){
      h += '<option value="'+c+'"'+(String(r.conc)===String(c)?' selected':'')+'>'+c+'%</option>';
    });
    h += '</select></td>';

    /* Vol */
    h += '<td style="padding:5px 8px"><div class="f-input-wrap" style="max-width:80px">';
    h += '<input type="number" class="f-input" style="font-size:12px" '+fc;
    h += ' value="'+esc(String(r.vol||''))+'" placeholder="0"';
    h += ' oninput="mezclaSetVol(\''+cid+'\','+i+',this.value)">';
    h += '</div></td>';

    /* Dose */
    h += '<td style="padding:5px 8px;font-weight:700;font-size:12px;color:'+(mg>0&&!isDil?clr:'var(--t3)')+'">'+
         (isDil?'Diluyente':(mg>0?mg+' mg':'—'))+'</td>';
    h += '</tr>';
  });

  /* Totals row */
  var totalVol=0, byDrug={};
  v.rows.forEach(function(r){
    var vol=parseFloat(r.vol)||0, conc=parseFloat(r.conc)||0;
    if(!vol||!r.drug||r.drug==='--- Seleccionar ---') return;
    totalVol += vol;
    var d=MEZCLA_DRUGS.find(function(x){return x.label===r.drug;});
    var isDil = d && d.maxMgKg===null && d.label!=='Fentanilo 50 mcg/mL';
    if(!isDil) {
      var mg=Math.round(conc*vol*10*10)/10;
      if(!byDrug[r.drug]) byDrug[r.drug]={mg:0,conc:conc,vol:0,maxMgKg:d&&d.maxMgKg,color:d&&d.color||col};
      byDrug[r.drug].mg  += mg;
      byDrug[r.drug].vol += vol;
    }
  });
  if(totalVol>0){
    var totalMg=0;
    Object.keys(byDrug).forEach(function(k){totalMg+=byDrug[k].mg;});
    h += '<tr style="border-top:2px solid '+col+';font-weight:800">';
    h += '<td style="padding:6px 10px;color:'+col+'">TOTAL</td>';
    h += '<td></td>';
    h += '<td style="padding:6px 10px;color:'+col+'">'+totalVol.toFixed(1)+' mL</td>';
    h += '<td style="padding:6px 10px;color:'+col+'">'+(totalMg>0?Math.round(totalMg*10)/10+' mg':'—')+'</td>';
    h += '</tr>';
  }
  h += '</tbody></table></div>';

  /* Results panel */
  h += '<div id="mzc-result-'+cid+'" style="margin-top:14px">';
  if(totalVol>0 && Object.keys(byDrug).length>0) {
    var alKeys = Object.keys(byDrug);

    /* Concentration final */
    h += '<div style="margin-bottom:10px">';
    /* Concentración final de CADA AL = mg_drug / vol_total / 10 */
    h += '<div style="margin-bottom:10px">';
    if(alKeys.length>0){
      h += '<div style="font-size:9px;font-weight:800;text-transform:uppercase;color:var(--t3);margin-bottom:6px">Concentraci\u00f3n final en la mezcla ('+totalVol.toFixed(1)+' mL totales)</div>';
      h += '<table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:8px">';
      h += '<thead><tr style="border-bottom:2px solid '+col+'">';
      h += '<th style="text-align:left;padding:5px 10px;font-size:9px;color:var(--t3);font-weight:800;text-transform:uppercase">F\u00e1rmaco</th>';
      h += '<th style="text-align:center;padding:5px 10px;font-size:9px;color:var(--t3);font-weight:800;text-transform:uppercase">Dosis total</th>';
      h += '<th style="text-align:center;padding:5px 10px;font-size:9px;color:var(--t3);font-weight:800;text-transform:uppercase">mg/mL</th>';
      h += '<th style="text-align:center;padding:5px 10px;font-size:9px;color:var(--t3);font-weight:800;text-transform:uppercase">Conc. final (%)</th>';
      h += '</tr></thead><tbody>';
      alKeys.forEach(function(drugName){
        var info=byDrug[drugName];
        var mgMl=Math.round(info.mg/totalVol*100)/100;
        var cf=(info.mg/totalVol/10).toFixed(3);
        h += '<tr style="border-bottom:1px solid var(--border)">';
        h += '<td style="padding:7px 10px;font-weight:700;color:'+info.color+'">'+drugName+'</td>';
        h += '<td style="padding:7px 10px;text-align:center;font-weight:700">'+info.mg+' mg</td>';
        h += '<td style="padding:7px 10px;text-align:center">'+mgMl+' mg/mL</td>';
        h += '<td style="padding:7px 10px;text-align:center;font-size:16px;font-weight:800;color:'+col+'">'+cf+'%</td>';
        h += '</tr>';
      });
      h += '</tbody></table>';
    }
    h += '</div>';

    /* Toxic dose bars */
    h += '<div style="font-size:9px;font-weight:800;text-transform:uppercase;color:var(--t3);margin-bottom:8px">Dosis T\u00f3xica por Peso'+(peso?' ('+peso+' kg)':'')+'</div>';
    alKeys.forEach(function(drugName){
      var info=byDrug[drugName];
      var maxMg = info.maxMgKg && peso ? info.maxMgKg*peso : null;
      var pct   = maxMg ? Math.min(Math.round(info.mg/maxMg*100),100) : null;
      var barColor = pct===null?info.color:pct<60?'#059669':pct<80?'#D97706':'#DC2626';
      var status   = pct===null?'(ingresa peso)':pct<60?'\u2713 SEGURO':pct<80?'\u26a0 PRECAUCI\u00d3N':'\u26a0 CERCA DEL L\u00cdMITE';
      h += '<div style="margin-bottom:10px">';
      h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">';
      h += '<span style="font-size:11px;font-weight:700;color:'+info.color+'">'+drugName+'</span>';
      h += '<span style="font-size:11px;font-weight:700;color:'+barColor+'">'+info.mg+' mg';
      if(maxMg) h += ' / '+Math.round(maxMg)+' mg m\u00e1x ('+info.maxMgKg+' mg/kg)';
      h += ' \u2014 '+status+'</span></div>';
      if(pct!==null){
        h += '<div style="height:10px;border-radius:5px;background:var(--border);overflow:hidden">';
        h += '<div style="width:'+pct+'%;height:100%;background:'+barColor+';border-radius:5px;transition:width .3s"></div></div>';
      }
      h += '</div>';
    });

    if(!peso){
      h += '<div style="font-size:10px;color:var(--t3);margin-top:4px">* Ingresa el peso para calcular dosis m\u00e1ximas</div>';
    }
    h += '<div style="font-size:10px;color:var(--t3);margin-top:4px">Ref: Lido 4.5 mg/kg | Mepi 5 mg/kg | Bupi 2.5 mg/kg | Levo 3 mg/kg | Ropi 3.5 mg/kg</div>';
  } else {
    h += '<div style="color:var(--t3);font-size:11px;padding:8px 0">Ingresa los componentes para ver el resultado</div>';
  }
  h += '</div>';

  h += '<button class="gen-btn" style="margin-top:14px;background:linear-gradient(135deg,'+col+','+col+'CC);box-shadow:0 3px 12px '+col+'40"';
  h += ' onclick="generateMezclaNote(\''+cid+'\')">&#9889; GENERAR NOTA</button>';
  h += '<div id="nw-'+cid+'">';
  if (S.notes[cid]) h += renderNoteWrap(S.notes[cid],cid,col);
  h += '</div></div>';

  setTimeout(function(){updateMezclaCalc(cid);},0);
  return h;
}

function generateMezclaNote(cid) {
  var v = getMezclaState(cid);
  var peso = parseFloat(v.peso) || 0;
  var totalVol = 0;
  var lines = [];
  var byDrug = {};

  v.rows.forEach(function(r) {
    var vol  = parseFloat(r.vol)  || 0;
    var conc = parseFloat(r.conc) || 0;
    if (!vol || !r.drug || r.drug==='--- Seleccionar ---') return;
    var mg  = Math.round(conc * vol * 10 * 10) / 10;
    var d   = MEZCLA_DRUGS.find(function(x){return x.label===r.drug;});
    totalVol += vol;
    lines.push(r.drug+' '+conc+'% '+vol+' ML ('+mg+' MG)');
    if (d && d.maxMgKg && peso) {
      var pct = Math.round(mg / (d.maxMgKg*peso) * 100);
      lines[lines.length-1] += ' — '+pct+'% DOSIS M\u00c1X';
    }
    if (!byDrug[r.drug]) byDrug[r.drug] = {mg:0, vol:0, maxMgKg:d&&d.maxMgKg||null};
    byDrug[r.drug].mg  += mg;
    byDrug[r.drug].vol += vol;
  });

  if (!lines.length) return;

  var alDrugs = Object.keys(byDrug).filter(function(k){return k!=='SSN / SSF (diluyente)' && k!=='Fentanilo 50 mcg/mL';});
  var concLine = '';
  if (alDrugs.length > 0) {
    var concParts = alDrugs.map(function(drugName){
      var info = byDrug[drugName];
      var mgMl = Math.round(info.mg / totalVol * 100) / 100;
      var cf   = (info.mg / totalVol / 10).toFixed(3);
      return drugName + ': ' + cf + '% (' + mgMl + ' mg/mL)';
    });
    concLine = '\nCONCENTRACIÓN FINAL EN MEZCLA ('+totalVol.toFixed(1)+' mL):\n'
             + concParts.join('\n');
  }

  var nota = 'MEZCLA ANAL\u00c9SICA PARA BLOQUEO:\n'+lines.join('\nM\u00c1S ')+'\nVOLUMEN TOTAL: '+totalVol.toFixed(1)+' ML'+concLine;
  var note = applyCase(nota, S.caseMode);
  S.notes[cid] = note;
  var col2 = getCatColor();
  var wrap = document.getElementById('nw-'+cid);
  if (wrap) wrap.innerHTML = renderNoteWrap(note, cid, col2);
}



/* ════════════════════════════════════════════════════
   FORMULARIO GENÉRICO — BLOQUEOS REGIONALES
   Lateralidad · Aguja · Calculadora de mezcla AL
════════════════════════════════════════════════════ */

var BLOQUEO_DRUGS = [
  {label:'--- Seleccionar ---', concs:[], max:0},
  {label:'Ropivacaína',      concs:[0.2,0.375,0.5,0.75,1], max:3.5, color:'#10B981'},
  {label:'Levobupivacaína',  concs:[0.125,0.25,0.375,0.5,0.75], max:3, color:'#F59E0B'},
  {label:'Bupivacaína',      concs:[0.125,0.25,0.375,0.5,0.75], max:2.5, color:'#EF4444'},
  {label:'Lidocaína',        concs:[0.5,1,1.5,2], max:4.5, color:'#0EA5E9'},
  {label:'Mepivacaína',      concs:[1,1.5,2,3], max:5, color:'#8B5CF6'},
  {label:'SSN / SSF',        concs:[0], max:0, color:'#6B7280'},
];

function getBloqueState(cid) {
  var key='blq_'+cid;
  if (!S.formVals[key]) S.formVals[key]={
    peso:'', lado:'DERECHO', aguja:'80 MM', tecnica:'ECOGUIADA',
    rows:[{drug:'',conc:'',vol:''},{drug:'',conc:'',vol:''},{drug:'',conc:'',vol:''}]
  };
  return S.formVals[key];
}

function getBlockTitle(cid) {
  var m=cid.match(/^([a-z]+)-(\d+)$/); if(!m) return '';
  var catId=m[1], idx=parseInt(m[2]);
  var cat=DATA.find(function(c){return c.id===catId;});
  return (cat&&cat.sections&&cat.sections[idx])?cat.sections[idx].title||'':'';
}

function blqSet(cid,key,val){
  var v=getBloqueState(cid); v[key]=val;
  if(key==='peso') blqUpdateCalc(cid);
}
function blqSetDrug(cid,row,drug){
  var v=getBloqueState(cid); v.rows[row].drug=drug;
  var d=BLOQUEO_DRUGS.find(function(x){return x.label===drug;});
  if(d&&d.concs.length===1) v.rows[row].conc=String(d.concs[0]); else v.rows[row].conc='';
  blqUpdateCalc(cid);
  var cs=document.getElementById('blq-conc-'+cid+'-'+row);
  if(cs&&d){var o='<option value="">---</option>';d.concs.forEach(function(c){o+='<option value="'+c+'">'+c+'%</option>';});cs.innerHTML=o;}
}
function blqSetConc(cid,row,val){getBloqueState(cid).rows[row].conc=val; blqUpdateCalc(cid);}
function blqSetVol(cid,row,val){getBloqueState(cid).rows[row].vol=val; blqUpdateCalc(cid);}

function blqCalc(v){
  var totalVol=0; var byDrug={};
  v.rows.forEach(function(r){
    var vol=parseFloat(r.vol)||0; var conc=parseFloat(r.conc)||0;
    if(!vol||!r.drug||r.drug==='--- Seleccionar ---') return;
    totalVol+=vol;
    var d=BLOQUEO_DRUGS.find(function(x){return x.label===r.drug;});
    var isDil=d&&d.max===0&&d.label!=='Fentanilo';
    if(!isDil){
      var mg=Math.round(conc*vol*10*10)/10;
      if(!byDrug[r.drug]) byDrug[r.drug]={mg:0,conc:conc,maxPerKg:d?d.max:0,color:d?d.color:'#888'};
      byDrug[r.drug].mg+=mg;
    }
  });
  return {totalVol:totalVol, byDrug:byDrug};
}

function blqUpdateCalc(cid){
  var v=getBloqueState(cid);
  var r=blqCalc(v); var peso=parseFloat(v.peso)||0;
  var pan=document.getElementById('blq-result-'+cid); if(!pan) return;
  var col=getCatColor();
  if(!r.totalVol){pan.innerHTML='<div style="color:var(--t3);font-size:11px;padding:6px 0">Ingresa los componentes</div>';return;}

  var alKeys=Object.keys(r.byDrug);
  var html='<div style="display:grid;grid-template-columns:repeat('+(alKeys.length+1)+',1fr);gap:8px;margin-top:8px">';
  function box(lbl,val,clr,hi){
    return '<div style="background:'+(hi?clr+'18':'var(--sidebar)')+';border:1px solid '+(hi?clr+'40':'var(--border)')+';border-radius:8px;padding:7px 10px;text-align:center">'+
      '<div style="font-size:9px;color:var(--t3);font-weight:700;text-transform:uppercase;margin-bottom:2px">'+lbl+'</div>'+
      '<div style="font-size:13px;font-weight:800;color:'+(hi?clr:'var(--t1)')+'">'+val+'</div></div>';
  }
  html+=box('VOLUMEN TOTAL',r.totalVol.toFixed(1)+' mL',col,true);
  alKeys.forEach(function(dn){
    var info=r.byDrug[dn];
    html+=box(dn,info.mg+' mg','',false);
  });
  html+='</div>';

  // Final concentration per AL
  if(alKeys.length>0){
    html+='<table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:10px">';
    html+='<thead><tr style="border-bottom:2px solid '+col+'">';
    ['Fármaco','Dosis total','mg/mL','Conc. final (%)'].forEach(function(h2){
      html+='<th style="text-align:left;padding:5px 8px;font-size:9px;color:var(--t3);font-weight:800;text-transform:uppercase">'+h2+'</th>';
    });
    html+='</tr></thead><tbody>';
    alKeys.forEach(function(dn){
      var info=r.byDrug[dn];
      var mgMl=Math.round(info.mg/r.totalVol*100)/100;
      var cf=(info.mg/r.totalVol/10).toFixed(3);
      var maxMg=peso>0&&info.maxPerKg>0?info.maxPerKg*peso:0;
      var pct=maxMg>0?Math.round(info.mg/maxMg*100):null;
      var clr=pct===null?info.color:pct<60?'#059669':pct<80?'#D97706':'#DC2626';
      html+='<tr style="border-bottom:1px solid var(--border)">';
      html+='<td style="padding:6px 8px;font-weight:700;color:'+info.color+'">'+dn+'</td>';
      html+='<td style="padding:6px 8px;font-weight:700">'+info.mg+' mg'+(pct!==null?' ('+pct+'% dosis máx)':'')+'</td>';
      html+='<td style="padding:6px 8px">'+mgMl+' mg/mL</td>';
      html+='<td style="padding:6px 8px;font-size:16px;font-weight:800;color:'+clr+'">'+cf+'%</td>';
      html+='</tr>';
    });
    html+='</tbody></table>';
    if(!peso) html+='<div style="font-size:10px;color:var(--t3);margin-top:4px">* Ingresa el peso para ver % de dosis máxima</div>';
  }
  pan.innerHTML=html;
}

/* ── Render form ─────────────────────────────────── */

function generateBloqueoNote(cid){
  var v=getBloqueState(cid);
  var titulo=getBlockTitle(cid)||'BLOQUEO REGIONAL';
  var calc=blqCalc(v);
  var peso=parseFloat(v.peso)||0;

  var lines=[];
  v.rows.forEach(function(r){
    var vol=parseFloat(r.vol)||0; var conc=parseFloat(r.conc)||0;
    if(!vol||!r.drug||r.drug==='--- Seleccionar ---') return;
    var mg=Math.round(conc*vol*10*10)/10;
    var d=BLOQUEO_DRUGS.find(function(x){return x.label===r.drug;});
    var isDil=d&&d.max===0;
    if(isDil) lines.push(r.drug+' '+vol.toFixed(1)+' ML');
    else {
      var extra='';
      if(peso>0&&d&&d.max>0){var pct=Math.round(mg/(d.max*peso)*100);extra=' ('+pct+'% DOSIS MÁX)';}
      lines.push(r.drug+' '+conc+'% '+vol.toFixed(1)+' ML ('+mg+' MG)'+extra);
    }
  });

  var alKeys=Object.keys(calc.byDrug);
  var concLines=alKeys.map(function(dn){
    var info=calc.byDrug[dn];
    var cf=(info.mg/calc.totalVol/10).toFixed(3);
    var mgMl=Math.round(info.mg/calc.totalVol*100)/100;
    return dn.toUpperCase()+': '+cf+'% ('+mgMl+' MG/ML)';
  });

  var raw=titulo.toUpperCase()+' '+v.lado+' \u2014 '+v.tecnica+'.\n\n'
    +'POSICIÓN ADECUADA. ASEPSIA / ANTISEPSIA. CAMPO ESTÉRIL.\n'
    +'AGUJA NEUROESTIMULADORA '+v.aguja+'.\n'
    +'BAJO VISIÓN ECOGUIADA SE IDENTIFICA EL NERVIO / PLANO FASCIAL Y SE REALIZA PUNCIÓN.\n'
    +'ASPIRACIONES NEGATIVAS.\n'
    +(lines.length
      ? '\nMEZCLA ANALGÉSICA:\n'+lines.join('\nMÁS ')+'\nVOLUMEN TOTAL: '+calc.totalVol.toFixed(1)+' ML.\n'
        +(concLines.length?'\nCONCENTRACIÓN FINAL EN MEZCLA:\n'+concLines.join('\n')+'\n':'')
      :'')
    +'\nPROCEDIMIENTO SIN COMPLICACIONES.';

  var note=applyCase(raw,S.caseMode);
  S.notes[cid]=note;
  var col2=getCatColor();
  var wrap=document.getElementById('nw-'+cid);
  if(wrap) wrap.innerHTML=renderNoteWrap(note,cid,col2);
}
